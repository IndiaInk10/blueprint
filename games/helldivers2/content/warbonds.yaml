# Warbonds with every page and medal cost, Superstore equipment and campaign rewards, from helldivers.wiki.gg.
# medalsToUnlock: null where the wiki does not know the page cost.
kind: warbond-catalog
schemaVersion: 1
revision: 1
updatedAt: 2026-09-27
currencies:
  - id: super-credits
    name:
      en: Super Credits
      ko: 슈퍼 크레딧
    text:
      en: Buys warbonds (premium 1,000, legendary 1,500) and Superstore items. Picked up on missions, and each premium warbond pays back 300 of its price; legendary ones pay back none.
      ko: 전쟁 채권(프리미엄 1,000, 레전더리 1,500)과 슈퍼 상점 아이템을 삽니다. 미션 중에 줍거나, 프리미엄 채권 안에서 300을 돌려받습니다. 레전더리 채권은 돌려주지 않습니다.
  - id: medals
    name:
      en: Medals
      ko: 메달
    text:
      en: Unlocks items inside a warbond; later pages open after enough medals are spent in that warbond. Capped at 250, so spend them before a Major Order pays out.
      ko: 채권 안의 아이템을 여는 데 씁니다. 그 채권에 메달을 충분히 써야 다음 페이지가 열립니다. 최대 250개까지만 보유되니 주요 명령 보상 전에 써 두세요.
  - id: requisition
    name:
      en: Requisition Slips
      ko: 요청서
    text:
      en: Buys the ship's standard stratagems once you reach their level, plus ship upgrades and weapon attachments. Capped at 50,000.
      ko: 레벨 조건을 채운 기본 스트라타젬과 함선 업그레이드, 무기 부착물을 삽니다. 최대 50,000까지 보유됩니다.
