combos:
  - id: pyromaniac
    title:
      en: Burn Unit
      ko: 방화광 소각반
    difficulty:
      min: 4
      max: 7
    primary: sg-451-cookout
    secondary: p-72-crisper
    throwable: g-10-incendiary
    stratagems:
      - flam-40-flamethrower
      - eagle-napalm-airstrike
      - a-flam-40-flame-sentry
      - ax-flam-75-guard-dog-hot-dog
    armorPassive: inflammable
    booster: firebomb-hellpods
    summary:
      en: Drop the Flame Sentry at a chokepoint, paint the bug breach with Napalm, then walk into the fire with the Flamethrower while the Hot Dog torches flankers. The Flamethrower still chews through Charger legs, and Inflammable armor lets you stand in your own blaze. Watch the wind on your teammates.
      ko: 화염 센트리를 길목에 박고 버그 브리치에 네이팜을 뿌린 다음, 화염방사기를 들고 불바다 속으로 걸어 들어가세요. 옆구리로 새는 놈들은 핫 도그가 알아서 지져 줍니다. 화염방사기는 차저 다리도 녹이고, 인화성 물질 아머 덕에 내가 지른 불 위에 서 있어도 버틸 만합니다. 팀원 쪽으로 불 번지는 건 조심.
    focus: weapon
    tagline:
      en: If it crawls, it burns. If it burns, it spreads.
      ko: 불로 시작해서 불로 끝나는 버그전 세팅
    whyFun:
      en: The whole map turns orange and every Hellpod landing is a free fireball.
      ko: 브리치 하나가 통째로 불바다가 되는 게 볼만합니다.
    armorSet:
      en: I-102 Draconaught
    bestAgainst:
      - terminids
    tags:
      - theme
      - chaos
  - id: gas-chemist
    title:
      en: Mad Chemist
      ko: 매드 케미스트
    difficulty:
      min: 4
      max: 6
    primary: ar-61-tenderizer
    secondary: p-35-re-educator
    throwable: g-4-gas
    stratagems:
      - tx-41-sterilizer
      - eagle-gas-airstrike
      - a-gm-17-gas-mortar-sentry
      - ax-tx-13-guard-dog-dog-breath
    armorPassive: advanced-filtration
    booster: localization-confusion
    summary:
      en: "Everything in this kit blinds, slows or confuses: mist a crowd with the Sterilizer, let Dog Breath keep gas on whatever gets close, and keep the Gas Mortar Sentry lobbing shells onto the horde. Confused enemies attack each other, so fire into the cloud rather than charging it. Heavies are the weak point: gas them, then save the Eagle Gas Airstrike for the big packs."
      ko: 이 세트의 모든 게 눈을 멀게 하고, 느리게 하고, 헷갈리게 만듭니다. 스터릴라이저로 무리에 안개를 뿌리고, 가까이 오는 놈은 독 브레스가 계속 가스를 먹이고, 가스 박격포 센트리가 무리 위로 포탄을 떨궈 줍니다. 혼란에 빠진 적은 서로 싸우니 구름 속으로 뛰어들지 말고 밖에서 쏘세요. 중장갑이 약점이니 대형 무리엔 이글 가스 타격을 아껴 두세요.
    focus: weapon
    tagline:
      en: Make them cough, make them confused, make them each other's problem.
      ko: 가스 뿌려 놓고 적끼리 싸우게 만드는 세팅
    whyFun:
      en: Watching a Hive Guard get bullied by its own swarm never gets old.
      ko: 가스 맞은 적들이 서로 치고받는 걸 구경할 수 있습니다.
    armorSet:
      en: AF-02 Haz-Master
    bestAgainst:
      - terminids
      - illuminate
    tags:
      - theme
      - team
  - id: arc-electrician
    title:
      en: Live Wire
      ko: 감전 전기공
    difficulty:
      min: 4
      max: 7
    primary: arc-12-blitzer
    secondary: cqc-19-stun-lance
    throwable: g-31-arc
    stratagems:
      - arc-3-arc-thrower
      - a-arc-3-tesla-tower
      - ax-arc-3-guard-dog-k-9
      - orbital-ems-strike
    armorPassive: electrical-conduit
    booster: stamina-enhancement
    summary:
      en: Plant the Tesla Tower on your fallback point and kite swarms through it, since Electrical Conduit makes you almost immune to your own arcs. The Arc Thrower and Blitzer never need ammo, so you only call resupply for grenades and stims. Freeze a big push with the EMS Strike and keep the K-9 on your back zapping stragglers.
      ko: 테슬라 탑을 후퇴 지점에 꽂고 적 무리를 그쪽으로 끌고 다니세요. 전도성 아머 덕에 내 전기에는 거의 안 맞습니다. 아크 발사기와 블리처는 탄약이 필요 없어서 재보급은 수류탄·스팀팩용이에요. 큰 물량은 EMS 타격으로 묶고, 등에 멘 K-9이 남은 놈들을 지져 줍니다.
    focus: weapon
    tagline:
      en: Infinite ammo, chain lightning, zero apologies.
      ko: 탄약 걱정 없는 아크 무기 몰빵
    whyFun:
      en: Chains of lightning jumping across a whole bug breach look and sound incredible.
      ko: 아크가 적 여러 마리를 줄줄이 타고 넘어가는 게 시원합니다.
    armorSet:
      en: EX-00 Prototype X
    bestAgainst:
      - terminids
      - illuminate
    tags:
      - theme
      - solo
  - id: recon-sniper
    title:
      en: Overwatch Nest
      ko: 고지대 저격 둥지
    difficulty:
      min: 4
      max: 7
    primary: r-6-deadeye
    secondary: p-4-senator
    throwable: g-3-smoke
    stratagems:
      - apw-1-anti-materiel-rifle
      - lift-860-hover-pack
      - orbital-railcannon-strike
      - orbital-precision-strike
    armorPassive: scout
    booster: uav-recon-booster
    summary:
      en: Hover up to rocks and rooftops the others can't reach and pick off Devastators, Hulk eyes and gunship engines with the Anti-Materiel Rifle. Scout armor turns your map pings into radar scans, so you mark targets for the squad and call Railcannon or Precision Strikes on anything too big. Smoke your own position when the bots get your range.
      ko: 호버 팩으로 남들이 못 가는 바위·옥상에 올라가 대물소총으로 디바스테이터, 헐크 눈, 건쉽 엔진을 저격하세요. 정찰 아머는 지도 마커가 레이더 스캔을 뿌려 주니 팀에게 표적을 찍어 주고, 너무 큰 놈에겐 레일캐넌이나 정밀 타격을 내리면 됩니다. 봇들이 조준을 잡으면 발밑에 연막을 까세요.
    focus: role
    tagline:
      en: One shot, one kill, one very confused Hulk.
      ko: 높은 곳에서 한 발씩 끊어 먹는 저격 세팅
    whyFun:
      en: Being the squad's eye in the sky from a perch nobody else can reach just feels cool.
      ko: 팀이 싸우는 동안 멀리서 대형 적을 하나씩 지워 주는 역할입니다.
    armorSet:
      en: SC-34 Infiltrator
    bestAgainst:
      - automatons
    tags:
      - roleplay
      - team
  - id: chainsaw-berserker
    title:
      en: Chainsaw Crusade
      ko: 전기톱 광전사
    difficulty:
      min: 4
      max: 6
    primary: smg-72-pummeler
    secondary: cqc-42-machete
    throwable: g-109-urchin
    stratagems:
      - cqc-9-defoliation-tool
      - lift-850-jump-pack
      - eat-17-expendable-anti-tank
      - eagle-500kg-bomb
    armorPassive: peak-physique
    booster: dead-sprint
    summary:
      en: Jump in, stick an Urchin to stun the pack, then grind through armour with the Defoliation Tool while Peak Physique boosts every hit. The Machete and Pummeler cover you while the chainsaw is not out. EATs and the 500kg handle Bile Titans, and the Jump Pack is your escape when the swarm closes in.
      ko: 점프 팩으로 뛰어들어 어친으로 무리를 기절시키고, 고엽 도구로 장갑째 갈아 버리세요. 이상적인 체형이 근접 피해를 올려 줍니다. 전기톱을 안 들었을 땐 마체테와 퍼멜러로 버티고, 바일 타이탄은 EAT와 500kg에 맡기세요. 포위당하면 점프 팩이 탈출구입니다.
    focus: weapon
    tagline:
      en: Why shoot a Charger when you can saw it?
      ko: 총 대신 톱 들고 들어가는 근접 세팅
    whyFun:
      en: It is pure DOOM energy, and the sound of a chainsaw on Charger armour is unmatched.
      ko: 차저한테 톱 들고 달려드는 손맛이 확실합니다.
    armorSet:
      en: PH-9 Predator
    bestAgainst:
      - terminids
    tags:
      - theme
      - challenge
  - id: shield-knight
    title:
      en: Paladin of Liberty
      ko: 민주주의 성기사
    difficulty:
      min: 4
      max: 6
    primary: mp-98-knight
    secondary: cqc-2-saber
    throwable: g-sh-39-shield
    stratagems:
      - cqc-1-one-true-flag
      - sh-20-ballistic-shield-backpack
      - eat-17-expendable-anti-tank
      - eagle-500kg-bomb
    armorPassive: rock-solid
    booster: vitality-enhancement
    summary:
      en: Every weapon here is one-handed, so the Ballistic Shield stays up while you advance with the Knight SMG or the flag spear. Walk into bot fire, drop the bubble Shield grenade over downed teammates, and use the EAT as your jousting lance against Hulks and tanks. Rock Solid keeps you standing through rocket blasts.
      ko: 여기 무기는 전부 한손이라 나이트 기관단총이든 깃발 창이든 탄도 방패를 든 채로 전진할 수 있습니다. 봇 사격을 정면으로 받아 내고, 쓰러진 팀원 위엔 실드 수류탄을 던져 주세요. 헐크와 탱크에겐 EAT를 기사의 랜스처럼 꽂으면 됩니다. 굳건한 바위 덕에 로켓 맞아도 잘 안 넘어집니다.
    focus: role
    tagline:
      en: Shield up, flag forward, for Super Earth!
      ko: 방패랑 깃발 들고 앞장서는 한손 무기 세팅
    whyFun:
      en: Advancing on a bot line behind a shield while waving the Super Earth flag is peak roleplay.
      ko: 방패로 봇 사격을 막으면서 밀고 들어가는 재미가 있습니다.
    armorSet:
      en: RS-20 Constrictor
    bestAgainst:
      - automatons
    tags:
      - roleplay
      - theme
  - id: demolitionist
    title:
      en: Controlled Demolition
      ko: 철거 전문가
    difficulty:
      min: 4
      max: 7
    primary: r-36-eruptor
    secondary: sg-22-bushwhacker
    throwable: ted-63-dynamite
    stratagems:
      - b-md-c4-pack
      - eat-411-leveller
      - eagle-cluster-bomb
      - orbital-380mm-he-barrage
    armorPassive: concussive-padding-grenadier
    booster: hellpod-space-optimization
    summary:
      en: "Nearly everything you own explodes: Eruptor rounds, extra dynamite and C4 you can stick on objectives and heavies. The Eruptor hurts you up close, so keep the Bushwhacker for anything that gets inside its range. Drop the 380mm on outposts and point the Leveller at anything with armour."
      ko: 들고 있는 게 거의 다 터집니다. 이럽터 탄, 넉넉한 다이너마이트, 목표물이나 대형 적에 붙이는 C4까지. 이럽터는 가까이서 쏘면 나도 맞으니, 붙은 적은 부시웨커로 정리하세요. 전초기지엔 380mm를, 장갑 달린 건 평탄화기로.
    focus: weapon
    tagline:
      en: Nothing on this map is load-bearing anymore.
      ko: 눈에 보이는 건 다 터뜨리는 폭파 세팅
    whyFun:
      en: Setting off a chain of C4 on a fortress and watching it fold is pure catharsis.
      ko: 요새에 C4를 여러 개 붙여 놓고 한 번에 터뜨리는 맛이 있습니다.
    armorSet:
      en: CPG-48 Sapper
    tags:
      - chaos
      - theme
    slotNotes:
      secondary:
        en: The Eruptor is unsafe at close range; the sawn-off is the answer when something reaches you.
        ko: 이럽터는 근거리에서 자폭 위험이 있어서, 붙은 적은 소드오프 산탄총으로 처리합니다.
  - id: combat-medic
    title:
      en: Combat Medic
      ko: 전투 의무병
    difficulty:
      min: 4
      max: 7
    primary: smg-37-defender
    secondary: p-11-stim-pistol
    throwable: g-89-smokescreen
    stratagems:
      - b-1-supply-pack
      - fx-12-shield-generator-relay
      - m-105-stalwart
      - eagle-smoke-strike
    armorPassive: med-kit
    booster: experimental-infusion
    summary:
      en: "Stay one step behind your squad: heal teammates from range with the Stim Pistol, hand out ammo and stims from the Supply Pack, and throw smoke to cover revives. Drop the Shield Relay when the team has to hold a point. The Stalwart is there to keep chaff off you, not to top the kill board."
      ko: 분대 한 걸음 뒤에 붙어서 각성제 권총으로 멀리서 팀원을 치료하고, 보급 팩으로 탄약과 스팀팩을 나눠 주세요. 부활시킬 땐 연막으로 가리고, 거점을 지켜야 하면 방어막 생성 릴레이를 까세요. 스털워트는 킬 먹으려는 게 아니라 나한테 붙는 잡몹 치우는 용도입니다.
    focus: role
    tagline:
      en: Nobody dies on my watch. Well, not twice.
      ko: 팀원 살리는 게 주 업무인 지원 세팅
    whyFun:
      en: Shooting a sprinting teammate with a stim dart and hearing them thank you is surprisingly rewarding.
      ko: 쓰러지기 직전인 팀원한테 스팀 쏴 주는 역할이 생각보다 재밌습니다.
    armorSet:
      en: CM-14 Physician
    tags:
      - roleplay
      - team
  - id: sentry-turtle
    title:
      en: Turtle Engineer
      ko: 거북이 공병
    difficulty:
      min: 4
      max: 7
    primary: sg-8s-slugger
    secondary: p-19-redeemer
    throwable: g-123-thermite
    stratagems:
      - a-g-16-gatling-sentry
      - a-ac-8-autocannon-sentry
      - a-m-12-mortar-sentry
      - a-mls-4x-rocket-sentry
    armorPassive: engineering-kit
    booster: armed-resupply-pods
    summary:
      en: "Pick a defensible spot near the objective and build a gun line: Gatling for chaff, Autocannon and Rocket Sentries for heavies, Mortar at the back for everything else. Engineering Kit gives you extra Thermites for Chargers and Hulks that reach the wall. Keep sentries out of your team's path so friendly turrets don't mow them down."
      ko: 목표 근처에 방어하기 좋은 자리를 잡고 포대를 짜세요. 개틀링은 잡몹, 오토캐넌·로켓 센트리는 대형, 뒤에 박격포는 나머지 전부. 공병 키트로 테르밋을 넉넉히 들고 벽까지 온 차저·헐크를 처리합니다. 아군이 오가는 길목엔 센트리를 두지 마세요, 포탑이 팀원까지 갈아 버립니다.
    focus: stratagem
    tagline:
      en: Why aim when the turrets can do it for you?
      ko: 포탑 깔아 놓고 버티는 방어전 세팅
    whyFun:
      en: Sitting behind a wall of four turrets on a defense mission feels like playing tower defense inside a shooter.
      ko: 방어 미션이 타워 디펜스처럼 됩니다.
    armorSet:
      en: CE-35 Trench Engineer
    bestAgainst:
      - terminids
      - automatons
    tags:
      - theme
      - solo
  - id: eagle-controller
    title:
      en: Eagle Air Traffic Control
      ko: 이글 항공 관제사
    difficulty:
      min: 4
      max: 7
    primary: br-14-adjudicator
    secondary: p-2-peacemaker
    throwable: g-16-impact
    stratagems:
      - eagle-500kg-bomb
      - eagle-cluster-bomb
      - eagle-strafing-run
      - eagle-110mm-rocket-pods
    armorPassive: servo-assisted
    booster: uav-recon-booster
    summary:
      en: Four Eagle stratagems share one plane, so you chain them in bursts and then rearm together. Servo-Assisted lets you throw beacons 30% farther, so you call strikes from a safe distance. Rocket Pods and the 500kg handle heavies, Cluster and Strafing Run clear the rest.
      ko: 이글 스트라타젬 네 개가 비행기 한 대를 같이 써서, 몰아서 쏟아붓고 한 번에 재무장하는 식으로 굴러갑니다. 서보 보조로 신호기를 30% 더 멀리 던지니 안전한 곳에서 폭격을 부르세요. 대형은 로켓 포드와 500kg, 나머지는 집속탄과 기총소사로 정리합니다.
    focus: stratagem
    tagline:
      en: Eagle-1, you are cleared for everything.
      ko: 이글 공습만 네 개 들고 가는 폭격 세팅
    whyFun:
      en: Calling in four airstrikes in a row and hearing the pilot's lines never gets old.
      ko: 공습 네 개를 연달아 부르는 게 시원합니다.
    armorSet:
      en: SA-12 Servo Assisted
    tags:
      - theme
      - chaos
  - id: mech-hangar
    title:
      en: Walker Main
      ko: 워커 유저
    difficulty:
      min: 4
      max: 6
    primary: sg-225-breaker
    secondary: gp-20-ultimatum
    throwable: g-60-anti-tank-seeker
    stratagems:
      - exo-45-patriot-exosuit
      - exo-49-emancipator-exosuit
      - exo-51-lumberer-exosuit
      - exo-55-breakthrough-exosuit
    armorPassive: blunt-force-mitigation
    booster: flexible-reinforcement-budget
    summary:
      en: "Call a different exosuit each time the last one breaks: Patriot for bugs, Emancipator for bots, Lumberer to torch hives, Breakthrough to bulldoze close-range pushes. Between mechs you are fragile, so play safe with the Breaker and save the Ultimatum and Anti-Tank Seeker for a heavy that catches you on foot."
