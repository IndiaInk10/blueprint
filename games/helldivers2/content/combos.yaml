      ko: SG-97 스위퍼는 연사가 빨라서 붙은 적한테 한 번에 쏟아붓기 좋습니다. 장전이 길어서 탄이 비면 SG-22 부시웨커로 버티고, 그동안 가드 독이 옆에서 잔챙이를 정리합니다. 차저나 타이탄은 LAS-99 퀘이사 캐넌으로, 버그 브리치는 이글 집속탄으로 처리합니다.
