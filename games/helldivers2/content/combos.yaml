    summary:
      en: Charge the PLAS-101 Purifier fully and drop the shot into the middle of a pack; the blast clears clumps of small bugs. Up close the splash hits you too, so swap to the P-113 Verdict. Motivational Shocks shortens slows from acid and similar hits, which helps a lot against spitter-heavy bug missions.
      ko: PLAS-101 퓨리파이어는 끝까지 충전해서 쏘면 폭발이 나니 뭉친 벌레 무리 한가운데에 한 발씩 넣습니다. 너무 붙으면 폭발에 나도 맞으니 그때는 P-113 버딕트로 바꿔 씁니다. 동기 부여 충격 부스터가 산성 둔화를 빨리 풀어 줘서 스피터 많은 벌레전에서 덜 답답합니다.
    focus: warbond
    warbond: polar-patriots
    tagline:
      en: Charged Purifier shots and Winter Warrior armor for snowy bug planets
      ko: 퓨리파이어 충전샷에 겨울 전사 아머 입고 눈 행성 도는 세트
    whyFun:
      en: Timing the release of each charged shot has a nice rhythm to it.
      ko: 충전 소리 듣다가 놓는 타이밍 맞추는 손맛이 있습니다.
    armorSet:
      en: CW-36 Winter Warrior
    bestAgainst:
      - terminids
      - illuminate
    tags:
      - theme
      - solo
  - id: wb-viper-commandos
    title:
      en: Viper Commandos Set
      ko: 독사 특공대 채권 세트
    difficulty:
      min: 4
      max: 6
    primary: ar-23a-liberator-carbine
    secondary: sg-22-bushwhacker
    throwable: k-2-throwing-knife
    stratagems:
      - m-105-stalwart
      - eagle-napalm-airstrike
      - orbital-napalm-barrage
      - eat-17-expendable-anti-tank
    armorPassive: peak-physique
    booster: experimental-infusion
    summary:
      en: The AR-23A Liberator Carbine is light and fast, good for firing on the move, and the SG-22 Bushwhacker blows off whatever reaches you. Peak Physique boosts melee and weapon handling, and Experimental Infusion turns every stim into a short speed boost. Burn big packs with napalm and save the EAT-17 for heavies.
      ko: AR-23A 리버레이터 카빈은 가볍고 연사가 빨라서 뛰면서 긁기 좋고, 붙은 적은 SG-22 부시웨커 한 방으로 떼어 냅니다. 이상적인 체형 패시브로 근접 피해와 조작성이 오르고, 실험용 주입 덕에 각성제를 맞을 때마다 잠깐 빨라집니다. 큰 무리는 이글 네이팜 공중타격으로 태우고 대형 적은 EAT-17로 처리합니다.
    focus: warbond
    warbond: viper-commandos
    tagline:
      en: Jungle commando kit for playing 80s action hero
      ko: 정글 행성에서 80년대 액션 영화 주인공 흉내 내는 특공대 세트
    whyFun:
      en: Running through the jungle with a Stalwart on your hip feels like an old action movie.
      ko: 스털워트 들고 정글을 뛰어다니면 딱 옛날 액션 영화 같습니다.
    armorSet:
      en: PH-202 Twigsnapper
    bestAgainst:
      - terminids
      - automatons
    tags:
      - roleplay
      - theme
  - id: wb-freedoms-flame
    title:
      en: Freedom's Flame Set
      ko: 자유의 불길 채권 세트
    difficulty:
      min: 4
      max: 7
    primary: flam-66-torcher
    secondary: p-72-crisper
    throwable: g-6-frag
    stratagems:
      - orbital-napalm-barrage
      - eagle-napalm-airstrike
      - las-99-quasar-cannon
      - md-i4-incendiary-mines
    armorPassive: inflammable
    booster: firebomb-hellpods
    summary:
      en: "The FLAM-66 Torcher is a flamethrower in the primary slot: hose down a bug pack, back off and let them burn. Inflammable armor cuts fire damage a lot, so you can fight next to your own fires. Chargers and Bile Titans take too long to burn, so use the LAS-99 Quasar Cannon on them, and lay MD-I4 Incendiary Mines on the paths bugs come from."
      ko: FLAM-66 토처는 주무기 칸에 들어가는 화염방사기라 벌레 무리에 불을 뿌리고 뒤로 빠지면 알아서 타 죽습니다. 인화성 물질 아머가 화염 피해를 크게 줄여 줘서 내가 붙인 불 옆에서 싸워도 버틸 만합니다. 오래 태워야 하는 차저나 바일 타이탄은 LAS-99 퀘이사 캐넌으로 잡고, 벌레가 들어오는 길엔 MD-I4 소이 지뢰를 깔아 둡니다.
    focus: warbond
    warbond: freedoms-flame
    tagline:
      en: Primary and sidearm are both flamethrowers
      ko: 주무기도 보조무기도 화염방사기인 불 채권
    whyFun:
      en: Bug waves burning up as fast as they arrive is very satisfying.
      ko: 들어오는 족족 타 버리는 벌레 떼를 보면 속이 시원합니다.
    armorSet:
      en: I-09 Heatseeker
    bestAgainst:
      - terminids
    tags:
      - theme
      - chaos
  - id: wb-chemical-agents
    title:
      en: Chemical Agents Set
      ko: 화학 요원 채권 세트
    difficulty:
      min: 4
      max: 6
    primary: sg-225-breaker
    secondary: p-11-stim-pistol
    throwable: g-4-gas
    stratagems:
      - tx-41-sterilizer
      - ax-tx-13-guard-dog-dog-breath
      - orbital-gas-strike
      - eat-17-expendable-anti-tank
    armorPassive: advanced-filtration
    booster: vitality-enhancement
    summary:
      en: Spray incoming packs with the TX-41 Sterilizer; confused enemies start attacking each other. Dog Breath keeps puffing gas around you, so Advanced Filtration armor is a must. Heal hurt teammates from range with the P-11 Stim Pistol, and use the EAT-17 on big targets that shrug off gas.
      ko: TX-41 스터릴라이저로 몰려오는 무리에 가스를 뿌리면 헷갈린 적끼리 서로 공격합니다. 독 브레스 가드 독이 옆에서 계속 가스를 뿜으니 고급 여과 아머는 꼭 입고, 다친 팀원은 P-11 각성제 권총으로 멀리서 치료합니다. 가스가 잘 안 먹히는 대형 적은 EAT-17로 정리합니다.
    focus: warbond
    warbond: chemical-agents
    tagline:
      en: Gas to confuse the enemy, stim darts to heal the squad
      ko: 가스로 적을 헷갈리게 하고 팀원한테 각성제 쏴 주는 화학 세트
    whyFun:
      en: Watching enemies fight each other inside your gas cloud never stops being funny.
      ko: 가스 속에서 적끼리 치고받는 걸 구경하는 재미가 있습니다.
