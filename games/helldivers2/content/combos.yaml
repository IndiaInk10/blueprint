  - id: wb-truth-enforcers
    title:
      en: Truth Enforcers Set
      ko: 진리의 집행자 채권 세트
    difficulty:
      min: 4
      max: 7
    primary: sg-20-halt
    secondary: plas-15-loyalist
    throwable: g-12-high-explosive
    stratagems:
      - mls-4x-commando
      - a-ac-8-autocannon-sentry
      - eagle-airstrike
      - orbital-ems-strike
    armorPassive: unflinching
    booster: dead-sprint
    summary:
      en: "The SG-20 Halt switches between stun rounds and flechettes: freeze whatever is close with stun rounds, then swap and finish it. Charge the PLAS-15 Loyalist for Devastators and Berserkers. Unflinching armor keeps your aim steady under bot fire, and Dead Sprint burns health to keep running, so only lean on it when escaping."
      ko: SG-20 홀트는 기절탄과 플레셰트탄을 바꿔 쓸 수 있어서 가까운 적은 기절탄으로 세워 두고 플레셰트탄으로 바꿔 처리합니다. 데바스테이터나 버서커는 PLAS-15 로열리스트를 충전해서 쏩니다. 결연함 아머라 봇 사격을 맞아도 조준이 덜 흔들리고, 데드 스프린트는 체력을 깎으면서 뛰는 거라 도망칠 때만 씁니다.
    focus: warbond
    warbond: truth-enforcers
    tagline:
      en: "Ministry of Truth enforcer: stun with the Halt, finish with the Loyalist"
      ko: 진리부 단속반처럼 홀트로 세워 놓고 로열리스트로 마무리하는 세트
    whyFun:
      en: Stunning a bot and then taking it apart at your leisure gets addictive.
      ko: 기절한 봇을 세워 놓고 하나씩 처리하는 게 은근 중독됩니다.
    armorSet:
      en: UF-50 Bloodhound
    bestAgainst:
      - automatons
    tags:
      - roleplay
      - theme
  - id: wb-urban-legends
    title:
      en: Urban Legends Set
      ko: 도시 전설 채권 세트
    difficulty:
      min: 4
      max: 6
    primary: smg-37-defender
    secondary: cqc-19-stun-lance
    throwable: g-16-impact
    stratagems:
      - sh-51-directional-shield
      - a-flam-40-flame-sentry
      - e-at-12-anti-tank-emplacement
      - orbital-ems-strike
    armorPassive: siege-ready
    booster: armed-resupply-pods
    summary:
      en: "Set up at a street entrance: E/AT-12 Anti-Tank Emplacement behind you, A/FLAM-40 Flame Sentry covering the gap. The SH-51 Directional Shield blocks fire from the front while your own shots go out, so hold behind it with the SMG-37 Defender and poke anything that reaches you with the CQC-19 Stun Lance. With Armed Resupply Pods, every supply drop doubles as a turret."
      ko: 골목 입구를 정하면 뒤쪽에 E/AT-12 대전차 거치포를, 틈새엔 A/FLAM-40 화염 센트리를 박아 둡니다. SH-51 방향 방패는 앞에서 오는 사격만 막고 내 총알은 밖으로 나가니, 그 뒤에서 SMG-37 디펜더를 쏘고 붙은 적은 CQC-19 기절 창으로 찌릅니다. 무장 재보급 포드 부스터를 켜면 보급 포드도 잠깐 포탑 노릇을 합니다.
    focus: warbond
    warbond: urban-legends
    tagline:
      en: Hold a city street behind a shield wall and turrets
      ko: 방패 세우고 포탑 깔아서 도시 골목 하나 지키는 세트
    whyFun:
      en: Turning one alley into a fortress and holding it feels like a tower defense game.
      ko: 골목 하나를 막아 놓고 버티는 게 디펜스 게임 하는 기분입니다.
    armorSet:
      en: SR-18 Roadblock
    bestAgainst:
      - terminids
      - illuminate
    tags:
      - team
      - theme
  - id: wb-servants-of-freedom
    title:
      en: Servants of Freedom Set
      ko: 자유의 종복 채권 세트
    difficulty:
      min: 4
      max: 6
    primary: las-17-double-edge-sickle
    secondary: gp-20-ultimatum
    throwable: g-50-seeker
    stratagems:
      - b-100-portable-hellbomb
      - eagle-500kg-bomb
      - orbital-laser
      - eat-17-expendable-anti-tank
    armorPassive: integrated-explosives
    booster: increased-reinforcement-budget
    summary:
      en: The LAS-17 Double-Edge Sickle never overheats, but it burns you as the heat climbs, so keep stims ready. One GP-20 Ultimatum shot takes care of a big target. Carry the B-100 Portable Hellbomb into the middle of a base and set it off, and since the IE-3 armor explodes when you die, going down in a crowd still takes enemies with you.
      ko: LAS-17 더블 엣지 시클은 과열이 안 되는 대신 열이 오를수록 내가 화상을 입으니 각성제를 아끼지 않습니다. 큰 놈은 GP-20 얼티메이텀 한 발로 정리합니다. B-100 휴대용 지옥폭탄은 기지 한가운데로 들고 뛰어 들어가 터뜨리는 용도고, IE-3 아머는 죽으면 몸이 터지니 적 무리 안에서 쓰러져도 손해가 덜합니다.
    focus: warbond
    warbond: servants-of-freedom
    tagline:
      en: "Martyr kit: even your death is an explosion"
      ko: 죽을 때도 터지는 순교자 세트
    whyFun:
      en: Every death takes a few enemies along, so even dying feels like part of the plan.
      ko: 쓰러질 때마다 주변 적을 같이 데려가니 죽는 것도 작전이 됩니다.
    armorSet:
      en: IE-3 Martyr
    bestAgainst:
      - automatons
      - terminids
    tags:
      - chaos
      - roleplay
  - id: wb-borderline-justice
    title:
      en: Borderline Justice Set
      ko: 정의의 경계선 채권 세트
    difficulty:
      min: 4
      max: 7
    primary: r-6-deadeye
    secondary: las-58-talon
    throwable: ted-63-dynamite
    stratagems:
      - lift-860-hover-pack
      - las-98-laser-cannon
      - eagle-cluster-bomb
      - orbital-precision-strike
    armorPassive: gunslinger
    booster: sample-extricator
    summary:
      en: Work the lever on the R-6 Deadeye and aim every shot at a weak point; Gunslinger armor gets the LAS-58 Talon into your hand almost instantly when something rushes you. Sample Extricator makes big enemies drop samples, so go out of your way to kill Hulks and Chargers with the LAS-98 Laser Cannon and the Precision Strike. Hover onto rocks with the LIFT-860 to shake off pursuers.
      ko: R-6 데드아이는 레버액션이라 한 발씩 약점을 노리고, 급할 때 꺼내는 LAS-58 탈론은 총잡이 아머 덕에 바로 손에 들립니다. 샘플 해방자 부스터가 대형 적을 잡으면 샘플을 떨구게 해 주니 헐크나 차저는 LAS-98 레이저 캐넌과 궤도 정밀 타격으로 일부러 찾아가서 잡습니다. 쫓기면 LIFT-860 호버 팩으로 바위 위에 떠서 추격을 끊습니다.
    focus: warbond
    warbond: borderline-justice
    tagline:
      en: Bounty hunter who drops big targets for their samples
      ko: 데드아이 들고 큰 놈만 골라 잡아 샘플 챙기는 현상금 사냥꾼
    whyFun:
      en: Every big kill can drop samples, so hunting heavies starts to feel worth it.
      ko: 큰 놈 쓰러뜨릴 때마다 샘플이 떨어지니 사냥하는 재미가 붙습니다.
    armorSet:
      en: GS-66 Lawmaker
    bestAgainst:
      - automatons
      - terminids
    tags:
      - roleplay
      - solo
  - id: wb-control-group
    title:
      en: Control Group Set
      ko: 대조군 채권 세트
    difficulty:
      min: 4
      max: 7
    primary: vg-70-variable
    secondary: p-19-redeemer
    throwable: g-31-arc
    stratagems:
      - plas-45-epoch
      - a-las-98-laser-sentry
      - lift-182-warp-pack
      - orbital-ems-strike
    armorPassive: adreno-defibrillator
    booster: stamina-enhancement
    summary:
      en: "Switch the VG-70 Variable between its fire modes: slow and accurate at range, fast and loose up close. The PLAS-45 Epoch fires after a charge, so learn the timing before relying on it against heavies. When you get swarmed, teleport out with the LIFT-182 Warp Pack; Adreno-Defibrillator armor brings you back briefly once after a lethal hit, which is your window to stim."
      ko: VG-70 배리어블은 사격 모드를 바꿔서 멀리선 느리고 정확하게, 가까이선 빠르게 긁습니다. PLAS-45 에포크는 충전 후에 나가는 플라즈마 캐넌이라 대형 적에게 쓰기 전에 모아 쏘는 타이밍부터 익혀 둡니다. 둘러싸이면 LIFT-182 워프 팩으로 순간이동해 빠지고, 아드레노-제세동기 아머가 죽을 때 한 번 잠깐 일으켜 주니 그 틈에 각성제를 맞습니다.
    focus: warbond
    warbond: control-group
    tagline:
      en: "Prototype lab gear: plasma cannon, laser sentry and a warp pack"
      ko: 플라즈마 캐넌, 레이저 센트리, 워프 팩까지 실험실 신무기만 챙긴 세트
    whyFun:
      en: Warping around next to a laser sentry makes a regular mission feel like sci-fi.
      ko: 레이저 센트리 옆을 워프로 오가다 보면 평범한 임무도 SF 영화 같아집니다.
    armorSet:
      en: AD-26 Bleeding Edge
    bestAgainst:
      - automatons
      - illuminate
    tags:
      - theme
      - solo
  - id: wb-dust-devils
    title:
      en: Dust Devils Set
      ko: 먼지 폭풍 채권 세트
    difficulty:
      min: 4
      max: 6
    primary: ar-2-coyote
    secondary: p-19-redeemer
    throwable: g-7-pineapple
    stratagems:
      - s-11-speargun
      - eat-700-expendable-napalm
      - ms-11-solo-silo
      - eagle-110mm-rocket-pods
    armorPassive: desert-stormer
    booster: stamina-enhancement
    summary:
      en: A few hits from the AR-2 Coyote set most enemies on fire, so sweep it across a pack and let them burn. Heavies get the S-11 Speargun or a missile from the MS-11 Solo Silo, and a shot from the EAT-700 Expendable Napalm puts a wall of fire in front of a charging swarm. Desert Stormer adds a bit of fire and gas resistance plus throw range, so the G-7 Pineapple reaches further.
      ko: AR-2 코요테는 몇 발만 맞혀도 불이 붙으니 무리에 한 번 긁어 두면 알아서 탑니다. 대형 적은 S-11 작살총이나 MS-11 솔로 사일로 미사일로 처리하고, 몰려드는 무리 앞엔 EAT-700 일회성 네이팜을 쏴서 불벽을 만듭니다. 사막 돌격대 패시브가 화염과 가스 피해를 조금 막아 주고 투척 거리도 늘려 줘서 G-7 파인애플을 멀리 던질 수 있습니다.
    focus: warbond
    warbond: dust-devils
    tagline:
      en: Desert raider with an incendiary rifle, a speargun and a personal missile silo
      ko: 불붙는 소총에 작살총, 개인 미사일 사일로까지 챙긴 사막 약탈자 세트
    whyFun:
      en: Switching between fire rifle, harpoon and missile keeps your hands busy in a good way.
      ko: 불 소총, 작살, 미사일을 번갈아 쓰느라 손이 바쁜 게 재밌습니다.
    armorSet:
      en: DS-191 Scorpion
    bestAgainst:
      - terminids
      - automatons
    tags:
      - theme
      - chaos
  - id: wb-python-commandos
    title:
      en: Python Commandos Set
      ko: 금사 특공대 채권 세트
    difficulty:
      min: 4
      max: 7
    primary: ar-gl-21-one-two
    secondary: p-19-redeemer
    throwable: g-6-frag
    stratagems:
      - m-1000-maxigun
      - eagle-airstrike
      - orbital-railcannon-strike
      - eat-17-expendable-anti-tank
    armorPassive: rock-solid
    booster: vitality-enhancement
    summary:
      en: The M-1000 Maxigun feeds from a big ammo backpack, so hold the trigger down on whole lines of infantry. Use the AR/GL-21 One-Two's underbarrel grenades on clumps and small nests, but not up close, since the blast reaches you. Rock Solid keeps you on your feet, so you can keep firing while taking hits.
      ko: M-1000 맥시건은 대용량 탄약 배낭을 메고 쓰는 거라 탄이 넉넉하니 보병 줄이 보이면 길게 긁어 줍니다. AR/GL-21 원-투의 총열 아래 유탄은 뭉친 적이나 작은 둥지에 쓰고, 가까이 쏘면 나도 맞으니 거리를 둡니다. 굳건한 바위 패시브로 잘 안 넘어져서 맞으면서도 계속 쏠 수 있습니다.
    focus: warbond
    warbond: python-commandos
    tagline:
      en: Maxigun on your back and a grenade launcher under the rifle
      ko: 맥시건 돌리면서 원-투 유탄까지 쏘는 금사 특공대 세트
    whyFun:
      en: The minigun barely stops the whole mission, which is exactly the point.
      ko: 미니건 소리가 임무 내내 거의 안 끊깁니다.
    armorSet:
      en: RS-40 Beast of Prey
    bestAgainst:
      - automatons
      - terminids
    tags:
      - theme
      - chaos
  - id: wb-redacted-regiment
    title:
      en: Redacted Regiment Set
      ko: 존재하지 않는 부대 채권 세트
    difficulty:
      min: 4
      max: 6
    primary: r-72-censor
    secondary: p-35-re-educator
    throwable: tm-1-lure-mine
    stratagems:
      - b-md-c4-pack
      - eagle-smoke-strike
      - orbital-railcannon-strike
      - orbital-ems-strike
    armorPassive: reduced-signature
    booster: concealed-insertion
    summary:
      en: The suppressed R-72 Censor removes patrols quietly from mid range, and with Reduced Signature armor you can get very close before anyone notices. Stick B/MD C4 on the objective or fabricator, back off and detonate, and throw a TM-1 Lure Mine in front of anything chasing you. If you are spotted, drop the Eagle Smoke Strike and disappear again.
      ko: 소음기 달린 R-72 센서로 순찰병을 중거리에서 조용히 끊고, 신호 감소 아머까지 입으면 적 코앞까지 들키지 않고 들어갈 수 있습니다. 목표물이나 공장엔 B/MD C4 팩을 붙여 두고 멀리 빠진 다음 터뜨리고, 쫓아오는 적 앞엔 TM-1 유인 지뢰를 던져 둡니다. 들켰으면 이글 연막 타격을 깔고 다시 숨습니다.
    focus: warbond
    warbond: redacted-regiment
    tagline:
      en: Sneak in unseen, plant C4, walk out
      ko: 안 들키게 들어가서 C4 붙이고 나오는 사보타주 세트
    whyFun:
      en: Blowing up a whole base without anyone knowing you were there is a real thrill.
      ko: 아무도 모르게 기지 하나를 통째로 날리고 빠져나오는 게 짜릿합니다.
    armorSet:
      en: RS-67 Null Cipher
    bestAgainst:
      - automatons
      - terminids
    tags:
      - solo
      - roleplay
  - id: wb-siege-breakers
    title:
      en: Siege Breakers Set
      ko: 공성 파괴자 채권 세트
    difficulty:
      min: 5
      max: 7
    primary: las-13-trident
    secondary: p-19-redeemer
    throwable: g-sh-39-shield
    stratagems:
      - cqc-20-breaching-hammer
      - eat-411-leveller
      - gl-28-belt-fed-grenade-launcher
      - eagle-500kg-bomb
    armorPassive: supplementary-adrenaline
    booster: vitality-enhancement
    summary:
      en: Break into bot bases through walls and doors with the CQC-20 Breaching Hammer, then sweep the inside with the GL-28 Belt-Fed Grenade Launcher. Tanks and turrets get the EAT-411 Leveller; when fire gets heavy, throw a G/SH-39 Shield to put up a bubble. Supplementary Adrenaline refills stamina whenever you take damage, so the charge rarely stalls.
      ko: 봇 기지 벽이나 문은 CQC-20 벽 폭파 망치로 부수고 들어가고, 안쪽 적은 GL-28 벨트식 유탄 발사기로 쓸어 담습니다. 탱크나 포탑은 EAT-411 평탄화기로 처리하고, 총알이 몰리면 G/SH-39 실드를 던져 방어막부터 세웁니다. 보급 아드레날린 패시브가 맞을 때마다 스태미나를 채워 줘서 돌격하다 멈출 일이 적습니다.
    focus: warbond
    warbond: siege-breakers
    tagline:
      en: Smash through the wall with a hammer and clear the room with grenades
      ko: 망치로 벽 부수고 들어가서 유탄으로 쓸어 담는 공성 세트
    whyFun:
      en: Breaking a wall open and coming face to face with the bots inside is the best moment of the run.
      ko: 벽 부수고 들어가서 안에 있던 봇이랑 딱 마주치는 순간이 제일 재밌습니다.
    armorSet:
      en: SA-7 Headfirst
    bestAgainst:
      - automatons
    tags:
      - team
      - chaos
  - id: wb-entrenched-division
    title:
      en: Entrenched Division Set
      ko: 견고한 참호 사단 채권 세트
    difficulty:
      min: 4
      max: 6
    primary: smg-flam-34-stoker
    secondary: p-69-veto
    throwable: g-48-giga-grenade
    stratagems:
      - a-gm-17-gas-mortar-sentry
      - b-flam-80-cremator
      - md-6-anti-personnel-minefield
      - e-mg-101-hmg-emplacement
    armorPassive: concussive-padding-hazmat
    booster: hellpod-space-optimization
    summary:
      en: Once you pick a spot to hold, put MD-6 mines in front and the E/MG-101 HMG Emplacement and A/GM-17 Gas Mortar Sentry behind. Whatever makes it past the guns gets burned with the B/FLAM-80 Cremator or the SMG/FLAM-34 Stoker, and big clumps get a G-48 Giga Grenade. The armor halves explosive damage and adds some gas resistance, so fighting near your own mortar is less risky.
      ko: 버틸 자리를 정하면 앞에 MD-6 대인 지뢰를 깔고 뒤에 E/MG-101 중기관총 거치포와 A/GM-17 가스 박격포 센트리를 세웁니다. 거치포까지 뚫고 들어온 적은 B/FLAM-80 크리메이터나 SMG/FLAM-34 스토커로 태우고, 크게 뭉친 무리엔 G-48 기가 수류탄을 던집니다. 아머가 폭발 피해를 반으로 줄이고 가스 저항도 조금 있어서 내 가스 박격포 근처에서 싸워도 덜 위험합니다.
    focus: warbond
    warbond: entrenched-division
    tagline:
      en: "Mines, machine-gun nest and gas mortar: dig in and hold"
      ko: 지뢰 깔고 기관총 진지 세우고 버티는 참호전 세트
    whyFun:
      en: Finishing the trench line and then watching wave after wave stall on it is very rewarding.
      ko: 진지를 다 짓고 밀려오는 적을 그 앞에서 막아 내면 뿌듯합니다.
    armorSet:
      en: CPH-26 Commandant
    bestAgainst:
      - terminids
      - automatons
    tags:
      - team
      - roleplay
  - id: wb-ironclad-democracy
    title:
      en: Ironclad Democracy Set
      ko: 철갑의 민주주의 채권 세트
    difficulty:
      min: 4
      max: 7
    primary: ar-11-arbitrator
    secondary: p-34-breacher
    throwable: g-8-immolation
    stratagems:
      - eat-17-expendable-anti-tank
      - exo-45-patriot-exosuit
      - eagle-airstrike
      - orbital-precision-strike
    armorPassive: blunt-force-mitigation
    booster: surplus-eat-allocation
    summary:
      en: Surplus EAT Allocation gives two free EAT-17 calls per mission, so drop one as soon as you land and spend it on the first heavy. The AR-11 Arbitrator's underbarrel shotgun handles anything close, and armored targets get a P-34 Breacher round stuck on them. Blunt Force Mitigation keeps you from being knocked down, so you can hold the front until the EXO-45 Patriot arrives.
      ko: 초과 EAT 할당 부스터로 EAT-17을 두 번 공짜로 부를 수 있으니 투하하자마자 하나 불러 두고 첫 대형 적에게 씁니다. AR-11 아비트레이터 아래 산탄총은 붙은 적용이고, 장갑 두른 놈은 P-34 브리처 탄을 붙여서 터뜨립니다. 둔기 충격 완화 아머라 잘 안 넘어지니 EXO-45 애국자 엑소슈트가 내려올 때까지 앞에서 버팁니다.
    focus: warbond
    warbond: ironclad-democracy
    tagline:
      en: Heavy armor and two free EAT calls per mission
      ko: 무거운 아머 입고 공짜 EAT까지 받아 쓰는 철갑 세트
    whyFun:
      en: You stay standing through rockets that would floor anyone else, so you just keep walking forward.
      ko: 봇 로켓을 맞아도 잘 안 넘어지니 그냥 계속 앞으로 걸어가게 됩니다.
    armorSet:
      en: BFM-16 Tanker
    bestAgainst:
      - automatons
      - terminids
    tags:
      - theme
      - solo
  - id: marksman-range
    title:
      en: Designated Marksman
      ko: 지정사수
    difficulty:
      min: 4
      max: 7
    primary: r-2-amendment
    secondary: p-92-warrant
    throwable: g-6-frag
    stratagems:
      - apw-1-anti-materiel-rifle
      - a-mg-43-machine-gun-sentry
      - eagle-smoke-strike
      - orbital-railcannon-strike
    armorPassive: scout
    booster: uav-recon-booster
    summary:
      en: Go prone on high ground and drop small enemies one by one with the R-2 Amendment; Devastators and Hulks get the APW-1 Anti-Materiel Rifle. Put the MG-43 Sentry next to you to catch anything that flanks, and when something slips through, the homing P-92 Warrant finishes it. Scout armor makes pinged spots on the map pulse radar, so you see what is coming.
      ko: 높은 곳에 엎드려서 R-2 어멘드멘트로 잔챙이를 한 발씩 끊고, 데바스테이터나 헐크는 APW-1 대물소총으로 잡습니다. 옆으로 돌아오는 적은 A/MG-43 기관총 센트리가 받아 주고, 그래도 붙은 놈은 유도되는 P-92 워런트로 마무리합니다. 정찰 아머라 지도에 찍은 곳에서 레이더가 계속 돌아서 뭐가 오는지 먼저 보입니다.
    focus: weapon
    tagline:
      en: Marksman rifle plus anti-materiel rifle, one shot at a time from prone
      ko: 지정사수 소총에 대물소총까지, 엎드려서 한 발씩 끊는 세팅
    whyFun:
      en: Picking a squad's approach apart one headshot at a time is calm and satisfying.
      ko: 멀리서 한 발씩 머리를 끊어 내는 게 조용하게 재밌습니다.
    armorSet:
      en: SC-30 Trailblazer Scout
    bestAgainst:
      - automatons
      - illuminate
    tags:
      - solo
      - theme
  - id: smg-run-gun
    title:
      en: Run and Gun
      ko: 뛰면서 쏘는 기관단총
    difficulty:
      min: 4
      max: 7
    primary: smg-32-reprimand
    secondary: p-19-redeemer
    throwable: g-16-impact
    stratagems:
      - ax-las-5-guard-dog-rover
      - las-99-quasar-cannon
      - eagle-strafing-run
      - orbital-gatling-barrage
    armorPassive: peak-physique
    booster: stamina-enhancement
    summary:
      en: The SMG-32 Reprimand hits hard for an SMG and handles well on the move, so keep sprinting and fire in short bursts while the Rover burns what chases you. When the magazine runs dry, keep shooting with the P-19 Redeemer instead of stopping to reload. Chargers and Harvesters get the LAS-99 Quasar Cannon; a pack in the open gets the Strafing Run.
      ko: SMG-32 레프리맨드는 기관단총치고 한 발이 세고 움직이면서도 잘 맞아서, 계속 뛰면서 짧게 끊어 쏘고 쫓아오는 놈은 로버가 지집니다. 탄창이 비면 멈춰서 장전하지 말고 P-19 리디머로 바꿔서 계속 쏩니다. 차저나 하베스터는 LAS-99 퀘이사 캐넌으로, 트인 곳에 모인 무리는 이글 기총소사로 정리합니다.
    focus: weapon
    tagline:
      en: SMG and machine pistol, never stop moving
      ko: 기관단총이랑 기관권총 들고 멈추지 않고 뛰어다니는 세팅
    whyFun:
      en: You almost never stand still, so the whole mission moves at full speed.
      ko: 거의 서 있을 일이 없어서 임무 전체가 빠르게 굴러갑니다.
    armorSet:
      en: PH-9 Predator
    bestAgainst:
      - terminids
      - illuminate
    tags:
      - solo
      - chaos
  - id: plasma-senator
    title:
      en: Plasma Rifleman
      ko: 플라즈마 소총수
    difficulty:
      min: 4
      max: 7
    primary: plas-1-scorcher
    secondary: p-4-senator
    throwable: g-12-high-explosive
    stratagems:
      - plas-45-epoch
      - eagle-airstrike
      - orbital-precision-strike
      - a-ac-8-autocannon-sentry
    armorPassive: fortified
    booster: hellpod-space-optimization
    summary:
      en: The PLAS-1 Scorcher's bolts do impact plus explosive damage, which is great on Devastator heads and Hulk vents at mid range. The splash also hits you, so switch to the P-4 Senator when a Berserker closes in. Fortified armor halves explosive damage and cuts recoil while crouched; the PLAS-45 Epoch handles tanks and fabricators.
      ko: PLAS-1 스코처는 한 발에 충격 피해와 폭발 피해가 같이 들어가서 중거리에서 데바스테이터 머리나 헐크 환기구를 노리기 좋습니다. 폭발이 나한테도 튀니 버서커가 붙으면 P-4 세너터로 바꿔 쏩니다. 강화 아머가 폭발 피해를 반으로 줄이고 앉아 쏠 때 반동도 줄여 주고, 탱크나 공장은 PLAS-45 에포크로 처리합니다.
    focus: weapon
    tagline:
      en: Scorcher on the bots, Senator when they get close
      ko: 스코처로 봇 약점 태우고 붙으면 세너터 꺼내는 플라즈마 세팅
    whyFun:
      en: Blue bolts popping on bot armor just looks and feels right.
      ko: 파란 플라즈마가 봇 장갑에 터지는 게 손맛이 확실합니다.
    armorSet:
      en: FS-05 Marksman
    bestAgainst:
      - automatons
    tags:
      - theme
      - solo
  - id: grenade-launcher-all
    title:
      en: Grenadier
      ko: 유탄 몰빵
    difficulty:
      min: 4
      max: 6
    primary: gl-15-evictor
    secondary: p-69-veto
    throwable: g-6-frag
    stratagems:
      - gl-21-grenade-launcher
      - gl-28-belt-fed-grenade-launcher
      - e-gl-21-grenadier-battlement
      - eagle-cluster-bomb
    armorPassive: concussive-padding-reinforced
    booster: hellpod-space-optimization
    summary:
      en: The GL-15 Evictor fires one 440-damage grenade per pump, so use it on clumps and medium targets at a safe distance, and draw the P-69 Veto when something is on top of you. The CPR-80 armor halves explosive damage, which forgives a lot of close calls. Bring the GL-21 for bug holes and the GL-28 Belt-Fed for long fights, and set up the Grenadier Battlement where you plan to hold.
      ko: GL-15 이빅터는 펌프질 한 번에 유탄 한 발이라 뭉친 적이나 중형 적에게 거리를 두고 쏘고, 코앞까지 온 놈은 P-69 비토로 처리합니다. CPR-80 아머가 폭발 피해를 반으로 줄여 줘서 가까이 터져도 꽤 봐줍니다. 벌레 구멍은 GL-21 유탄 발사기로, 오래 싸울 땐 GL-28 벨트식으로 바꾸고, 버틸 자리엔 E/GL-21 척탄 흉벽을 세웁니다.
    focus: weapon
    tagline:
      en: Pump-action grenade launcher primary and every grenade launcher on the stratagem list
      ko: 주무기도 유탄, 지원무기도 유탄, 거치물도 유탄인 세팅
    whyFun:
      en: There is always something going boom in front of you, which never gets boring.
      ko: 눈앞에서 계속 뭔가 터지고 있어서 지루할 틈이 없습니다.
    armorSet:
      en: CPR-80 Bulwark
    bestAgainst:
      - terminids
      - automatons
    tags:
      - chaos
      - theme
  - id: heat-sink-lasers
    title:
      en: Heat Management
      ko: 열 관리반
    difficulty:
      min: 4
      max: 7
    primary: las-13-trident
    secondary: las-58-talon
    throwable: g-16-impact
    stratagems:
      - las-99-quasar-cannon
      - sh-32-shield-generator-pack
      - orbital-laser
      - eagle-airstrike
    armorPassive: med-kit
    booster: vitality-enhancement
    summary:
      en: The LAS-13 Trident is a laser shotgun that fires six short beams at once, great at close range; let it cool while the LAS-58 Talon covers you. All three energy weapons run on heat rather than ammo, so resupply matters far less than usual. The Shield Generator Pack and Med-Kit armor keep you standing in close fights, and the Quasar Cannon covers anything armored.
      ko: LAS-13 트라이던트는 짧은 빔 여섯 줄이 한 번에 나가는 레이저 산탄총이라 가까운 적에게 강하고, 열이 차면 LAS-58 탈론으로 바꿔 쏘면서 식힙니다. 에너지 무기 셋이 전부 탄 대신 열로 돌아가서 보급 상자 걱정이 훨씬 줄어듭니다. SH-32 방어막 생성 팩과 구급 키트 아머로 근접전에서 버티고, 장갑 달린 놈은 LAS-99 퀘이사 캐넌으로 잡습니다.
    focus: weapon
    tagline:
      en: No magazines, just laser guns and a heat gauge
      ko: 탄창 대신 열 게이지만 보면서 쏘는 레이저 총 세팅
    whyFun:
      en: You spend the whole mission without once worrying about running out of ammo.
      ko: 임무 내내 탄약 걱정을 한 번도 안 하게 됩니다.
    armorSet:
      en: CM-09 Bonesnapper
    bestAgainst:
      - terminids
      - illuminate
    tags:
      - theme
      - solo
  - id: crossbow-hunter
    title:
      en: Crossbow Hunter
      ko: 석궁 사냥꾼
    difficulty:
      min: 4
      max: 6
    primary: cb-9-exploding-crossbow
    secondary: p-113-verdict
    throwable: k-2-throwing-knife
    stratagems:
      - ax-las-5-guard-dog-rover
      - mls-4x-commando
      - eagle-500kg-bomb
      - orbital-airburst-strike
    armorPassive: scout
    booster: uav-recon-booster
    summary:
      en: CB-9 bolts fly in a slow arc, so you can lob them over rocks and cover onto enemies behind it. The blast is dangerous up close; when something rushes you, swap to the P-113 Verdict and let the Rover help. Scout armor keeps enemies from spotting you as early, so the Commando is best fired from far off before they react.
      ko: CB-9 익스플로딩 크로스보우 볼트는 느리게 포물선을 그려서 바위나 엄폐물 너머 적한테 떨어뜨릴 수 있습니다. 가까이선 폭발에 나도 다치니 달려드는 적은 P-113 버딕트로 바꿔 쏘고 로버한테 맡깁니다. 정찰 아머라 적이 나를 늦게 알아채니 MLS-4X 코만도는 적이 반응하기 전에 멀리서 먼저 쏩니다.
    focus: weapon
    tagline:
      en: Exploding crossbow and a heavy revolver, lobbing bolts from cover
      ko: 폭발 석궁으로 엄폐물 너머에 볼트 떨구는 사냥꾼 세팅
    whyFun:
      en: Landing a bolt in an arc over cover onto a target you can barely see feels skillful.
      ko: 엄폐물 너머로 포물선 그려서 맞히면 은근 실력 느는 기분이 듭니다.
    armorSet:
      en: CW-4 Arctic Ranger
    bestAgainst:
      - terminids
      - automatons
    tags:
      - challenge
      - solo
  - id: dog-and-turrets
    title:
      en: Pack Handler
      ko: 자동 화력 조련사
    difficulty:
      min: 4
      max: 6
    primary: ar-23-liberator
    secondary: p-2-peacemaker
    throwable: g-6-frag
    stratagems:
      - ax-ar-23-guard-dog
      - a-mg-43-machine-gun-sentry
      - a-m-23-ems-mortar-sentry
      - a-mls-4x-rocket-sentry
    armorPassive: engineering-kit
    booster: uav-recon-booster
    summary:
      en: Every time you stop, drop the MG-43 Sentry and Rocket Sentry side by side and put the EMS Mortar Sentry behind them to stun whatever approaches. The Guard Dog follows you around and shoots small enemies, so your own gun is mostly for finishing things. Sentries fire even with a teammate in the way, so place them off the squad's path.
      ko: 멈출 때마다 A/MG-43 기관총 센트리와 A/MLS-4X 로켓 센트리를 나란히 깔고, 뒤에 A/M-23 EMS 박격포 센트리를 세워서 다가오는 적을 기절시킵니다. AX/AR-23 가드 독이 따라다니면서 잔챙이를 쏴 주니 내 총은 마무리용 정도로 씁니다. 센트리는 앞에 팀원이 있어도 그냥 쏘니 팀이 지나다니는 길은 피해서 깝니다.
    focus: stratagem
    tagline:
      en: Guard dog on your back, three sentries around you, very little shooting of your own
      ko: 가드 독 메고 센트리 셋 깔아서 내가 쏠 일을 줄이는 조합
    whyFun:
      en: Most of the kills come from things you placed, so you get to play commander.
      ko: 처치 대부분이 내가 깔아 둔 것들한테서 나와서 지휘관 하는 기분이 납니다.
    armorSet:
      en: CE-35 Trench Engineer
    bestAgainst:
      - terminids
      - automatons
    tags:
      - team
      - theme
  - id: rocket-barrage
    title:
      en: Rocket Barrage
      ko: 로켓 몰빵
    difficulty:
      min: 5
      max: 7
    primary: sg-8s-slugger
    secondary: p-33-missile-pistol
    throwable: g-60-anti-tank-seeker
    stratagems:
      - faf-14-spear
      - mls-4x-commando
      - a-mls-4x-rocket-sentry
      - eagle-110mm-rocket-pods
    armorPassive: servo-assisted
    booster: hellpod-space-optimization
    summary:
      en: Lock the FAF-14 Spear onto tanks, turrets and fabricators and fire from beyond their range. The MLS-4X Commando is for a quick volley when a target is close, and the Rocket Sentry and 110mm Rocket Pods cover you while the Spear reloads. The P-33 Missile Pistol and G-60 Anti-Tank Seeker mean even your sidearm and grenades hit armor.
      ko: FAF-14 스피어를 탱크, 포탑, 공장에 락온해서 적 사거리 밖에서 쏩니다. 가까이 온 대형 적은 MLS-4X 코만도로 빠르게 몰아 쏘고, 스피어 장전하는 동안은 A/MLS-4X 로켓 센트리와 이글 110mm 로켓 포드가 받쳐 줍니다. P-33 미사일 권총과 G-60 대전차 드론까지 챙겨서 보조무기와 수류탄도 장갑을 칠 수 있습니다.
    focus: stratagem
    tagline:
      en: Spear lock-ons, Commando, rocket sentry and rocket pods
      ko: 스피어부터 로켓 포드까지 로켓만 네 종류 챙긴 대전차 조합
    whyFun:
      en: Hearing the lock-on tone and watching the missile arc into a tank is really satisfying.
      ko: 락온 소리 듣고 미사일이 탱크로 꽂히는 게 시원합니다.
    armorSet:
      en: SA-32 Dynamo
    bestAgainst:
      - automatons
      - terminids
    tags:
      - team
      - theme
  - id: machine-gun-nest
    title:
      en: Machine Gun Nest
      ko: 기관총 진지
    difficulty:
      min: 4
      max: 6
    primary: ar-23c-liberator-concussive
    secondary: p-2-peacemaker
    throwable: g-12-high-explosive
    stratagems:
      - mg-206-heavy-machine-gun
      - a-mg-43-machine-gun-sentry
      - e-mg-101-hmg-emplacement
      - eagle-strafing-run
    armorPassive: fortified
    booster: vitality-enhancement
    summary:
      en: Crouch or go prone with the MG-206 Heavy Machine Gun; Fortified armor cuts recoil further, so you can hold on target. Build a line with the E/MG-101 HMG Emplacement and MG-43 Sentry side by side, and use the Strafing Run on packs in the open. The concussive Liberator knocks enemies back, which buys time on the reload.
      ko: MG-206 중기관총은 앉거나 엎드려서 쏘고, 강화 아머가 그 자세 반동을 더 줄여 줘서 목표에 계속 붙여 둘 수 있습니다. E/MG-101 중기관총 거치포와 A/MG-43 기관총 센트리를 나란히 세워 사선을 만들고, 트인 곳에 몰린 무리엔 이글 기총소사를 부릅니다. AR-23C 리버레이터 컨커시브는 적을 밀어내서 장전할 시간을 벌어 줍니다.
    focus: stratagem
    tagline:
      en: Heavy machine gun, MG sentry, HMG emplacement and strafing runs
      ko: 들고 쏘는 것도, 까는 것도, 하늘에서 오는 것도 전부 기관총
    whyFun:
      en: Three machine guns firing down the same street at once sounds great.
      ko: 기관총 세 자루가 한 방향으로 같이 쏟아붓는 소리가 좋습니다.
    armorSet:
      en: FS-23 Battle Master
    bestAgainst:
      - automatons
      - illuminate
    tags:
      - team
      - theme
