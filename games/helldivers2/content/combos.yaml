      ko: B-100 휴대용 지옥폭탄을 메고 이글 연막 타격으로 시야를 가린 다음 기지 안쪽까지 뛰어듭니다. 길을 막는 적은 궤도 EMS 타격으로 묶거나 AR-23C 리버레이터 컨커시브로 밀쳐 내고, 설치하면 카운트다운 동안 최대한 멀리 빠집니다. 아머가 죽을 때 터지니 팀원 옆에서 죽지 않게 조심합니다.
