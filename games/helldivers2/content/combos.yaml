    summary:
      en: The R-36 Eruptor fires one heavy explosive round at a time, so use it from range on fabricators, bug holes and Devastators. Engineering Kit adds two more Thermite grenades; stick those on tanks and Chargers, and switch to the P-19 Redeemer when something gets close, because the Eruptor will hurt you at point blank.
      ko: R-36 이럽터는 한 발씩 끊어 쏘는 폭발 소총이라 공장, 벌레 구멍, 데바스테이터를 멀리서 처리하는 데 씁니다. 공병 키트 패시브로 G-123 테르밋을 두 개 더 들고 다니니 탱크나 차저엔 붙여서 녹이고, 가까이 붙은 적은 P-19 리디머로 바꿔 쏩니다. 이럽터는 코앞에서 쏘면 나도 휘말리니 거리부터 벌리고 쏩니다.
    focus: warbond
    warbond: democratic-detonation
    tagline:
      en: "Eruptor and Thermite: everything in this warbond blows something up"
      ko: 이럽터랑 테르밋으로 보이는 건 다 터뜨리는 폭발물 채권
    whyFun:
      en: Every trigger pull ends in an explosion somewhere, and that never gets old.
      ko: 방아쇠 당길 때마다 어디선가 뭔가 터지니 질릴 틈이 없습니다.
    armorSet:
      en: CE-07 Demolition Specialist
    bestAgainst:
      - automatons
      - terminids
    tags:
      - theme
      - chaos
  - id: wb-polar-patriots
    title:
      en: Polar Patriots Set
      ko: 극지의 애국자 채권 세트
    difficulty:
      min: 4
      max: 7
    primary: plas-101-purifier
    secondary: p-113-verdict
    throwable: g-13-incendiary-impact
    stratagems:
