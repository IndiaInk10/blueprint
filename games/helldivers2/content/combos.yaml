      ko: EXO-55 돌파구 엑소슈트를 타고 방패를 든 채 걸어 나가면 팀원들이 뒤에 붙어서 따라옵니다. 엑소가 터지면 SH-32 방어막 생성 팩을 메고 LAS-99 퀘이사 캐넌으로 탱크와 공장 환기구를 처리합니다. 궤도 연막 타격은 엑소를 부를 때나 뒤로 빠질 때 시야를 끊는 데 씁니다.
