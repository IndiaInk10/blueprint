      ko: LIFT-850 점프 팩이랑 산소 공급기 아머로 이동 속도를 최대로 올리고 목표 사이를 쉬지 않고 뛰어다닙니다. 쫓아오는 적은 StA-11 기관단총으로 끊으면서 궤도 연막 타격이나 G-3 연막으로 따돌립니다. 목표를 막고 있는 대형 적은 EAT-17이나 궤도 정밀 타격으로 한 번에 치우고 지나갑니다.
