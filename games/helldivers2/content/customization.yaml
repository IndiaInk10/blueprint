# Weapon attachments (primaries only) with a recommended setup per weapon, from helldivers.wiki.gg and 2025-2026 guides.
kind: weapon-customization
schemaVersion: 1
revision: 1
updatedAt: 2026-09-27
system:
  en: "Weapon customization (added in 1.003.000, May 2025) applies to primary weapons only. Secondaries, throwables and crossover or legacy primaries (StA-11, StA-52, M7S, M90A, MA5C, R/40-K Hot-Shot, R-2124 Constitution, PLAS-39 Accelerator Rifle, FLAM-66 Torcher) cannot be customized. Each customizable primary has up to four slots: optic, muzzle (shotguns use chokes, the Sai uses lenses), underbarrel, and magazine (laser weapons use heatsinks); which slots and parts exist varies per weapon. The weapon levels 1-25 from ordinary mission XP earned while it is in your loadout; each level unlocks specific parts, which are then bought with Requisition Slips (0 for defaults, otherwise 3,000-25,000). Most parts are sidegrades: recoil reduction usually costs sway or ergonomics (how quickly the muzzle follows your crosshair), and bigger magazines reload slower and carry fewer spares. Paint patterns unlock the same way but are purely cosmetic."
  ko: "무기 커스터마이징은 1.003.000(2025년 5월)에 추가되었고 주 무기에만 적용됩니다. 보조 무기, 투척 무기, 콜라보·일부 주 무기(StA-11, StA-52, M7S, M90A, MA5C, R/40-K 핫샷 마크맨 라이플, R-2124 콘스티튜션, PLAS-39 가속 소총, FLAM-66 토처)는 개조할 수 없습니다. 개조 가능한 주 무기는 최대 4개 슬롯을 가집니다: 광학 장비, 총구(산탄총은 초크, 사이는 렌즈), 총열 하부, 탄창(레이저 무기는 방열판). 어떤 슬롯과 파츠가 있는지는 무기마다 다릅니다. 해당 무기를 장비하고 미션을 하면 얻는 경험치로 무기 레벨(1~25)이 오르고, 레벨마다 정해진 부착물이 해금되며 요청 신청서로 구매해야 장착할 수 있습니다(기본 파츠 0, 나머지 3,000~25,000). 대부분 부착물은 사이스그레이드라서 반동을 줄이면 흔들림이나 인체공학성(총구가 조준점을 따라오는 속도)이 나빠지고, 큰 탄창은 재장전이 느리고 예비 탄창이 줄어듭니다. 도색 패턴도 같은 방식으로 해금되지만 외형만 바뀝니다."
slots:
  - id: optic
    name:
      en: Optics
      ko: 광학 장비
  - id: muzzle
    name:
      en: Muzzle
      ko: 총구
  - id: underbarrel
    name:
      en: Underbarrel
      ko: 총열 하부
  - id: magazine
    name:
      en: Magazine / Heatsink
      ko: 탄창 / 방열판
attachments:
  - id: tube-red-dot-1-5x
    name:
      en: 1.5x Tube Red Dot
      ko: 1.5x 튜브 레드 도트
    slot: optic
    effect:
      en: 1.5x tube red dot; single 37.5 m zero, no ergonomics penalty.
      ko: 1.5배 튜브 레드 도트. 영점 37.5m 고정, 인체공학성 감소 없음.
    icon: 1.5x_tube_red_dot.png
  - id: tube-red-dot-2x
    name:
      en: 2x Tube Red Dot
      ko: 2x 튜브 레드 도트
    slot: optic
    effect:
      en: 2x magnification, zero 25/50/100 m; ergonomics -1.
      ko: 2배율, 영점 25/50/100m, 인체공학성 -1.
    icon: Armory_2x_Tube_Red_Dot.png
  - id: combat-scope-4x
    name:
      en: 4x Combat Scope
      ko: 4x 전투 스코프
    slot: optic
    effect:
      en: 4x magnification, zero 25/75/150 m; ergonomics -2.
      ko: 4배율, 영점 25/75/150m, 인체공학성 -2.
    icon: Armory_4x_Combat_Scope.png
  - id: sniper-scope-10x
    name:
      en: 10x Sniper Scope
      ko: 10x 저격 스코프
    slot: optic
    effect:
      en: 10x magnification, zero 50/100/200 m; ergonomics -4.
      ko: 10배율, 영점 50/100/200m, 인체공학성 -4.
    icon: Armory_10x_sniper_scope.png
  - id: reflex-sight
    name:
      en: Reflex Sight
      ko: 반사식 조준경
    slot: optic
    effect:
      en: Unmagnified reflex dot, 25 m zero; no ergonomics penalty.
      ko: 무배율 도트 조준경, 영점 25m, 인체공학성 감소 없음.
    icon: Armory_reflex_sight.png
  - id: reflex-sight-mk2
    name:
      en: Reflex Sight Mk2
      ko: 반사식 조준경 MK2
    slot: optic
    effect:
      en: Alternative unmagnified reflex dot, 25 m zero; no ergonomics penalty.
      ko: 다른 형태의 무배율 도트 조준경, 영점 25m, 인체공학성 감소 없음.
    icon: Armory_Reflex_Sight_mk2.png
  - id: holographic-sight
    name:
      en: Holographic Sight
      ko: 홀로그램 조준경
    slot: optic
    effect:
      en: Unmagnified holographic sight, 25 m zero; no ergonomics penalty.
      ko: 무배율 홀로그램 조준경, 영점 25m, 인체공학성 감소 없음.
    icon: Armory_Holographic_Sight.png
  - id: iron-sight
    name:
      en: Iron Sight
      ko: 기계식 조준기
    slot: optic
    effect:
      en: Iron sights, 25 m zero; ergonomics +5.
      ko: 기계식 가늠자, 영점 25m, 인체공학성 +5.
    icon: Armory_Iron_Sights.png
  - id: no-optics
    name:
      en: No Optics
      ko: 광학 장비 없음
    slot: optic
    effect:
      en: Built-in sights only, 25 m zero; no ergonomics bonus (unlike Iron Sight).
      ko: 기본 내장 가늠자만 사용, 영점 25m. 기계식 조준기와 달리 인체공학성 보너스 없음.
  - id: no-muzzle
    name:
      en: No Attachment (muzzle)
      ko: 총구 부착물 없음
    slot: muzzle
    effect:
      en: Bare muzzle; no stat changes.
      ko: 총구 부착물 없음. 능력치 변화 없음.
    icon: No_muzzle_attachment.png
  - id: flash-hider
    name:
      en: Flash Hider
      ko: 소염기
    slot: muzzle
    effect:
      en: Horizontal recoil -20%, vertical recoil -10%, sway +10%, ergonomics -3; smaller muzzle flash.
      ko: 수평 반동 -20%, 수직 반동 -10%, 흔들림 +10%, 인체공학성 -3. 총구 화염 감소.
    icon: Flash_hider.png
  - id: muzzle-brake
    name:
      en: Muzzle Brake
      ko: 총구 제동기
    slot: muzzle
    effect:
      en: Horizontal recoil -40%, sway +20% (+50% on HYENA), ergonomics -5.
      ko: 수평 반동 -40%, 흔들림 +20%(하이에나는 +50%), 인체공학성 -5.
    icon: Muzzle_brake.png
  - id: compensator
    name:
      en: Compensator
      ko: 보정기
    slot: muzzle
    effect:
      en: Vertical recoil -30%, sway +25%, ergonomics -5.
      ko: 수직 반동 -30%, 흔들림 +25%, 인체공학성 -5.
    icon: Compensator.png
  - id: half-choke
    name:
      en: Half Choke
      ko: 하프 초크
    slot: muzzle
    effect:
      en: Pellet spread -25% (horizontal and vertical).
      ko: 산탄 확산 -25%(수평·수직).
    icon: Half_choke.png
  - id: full-choke
    name:
      en: Full Choke
      ko: 풀 초크
    slot: muzzle
    effect:
      en: Pellet spread -50% (horizontal and vertical).
      ko: 산탄 확산 -50%(수평·수직).
    icon: Full_choke.png
  - id: duckbill
    name:
      en: Duckbill
      ko: 덕빌
    slot: muzzle
    effect:
      en: Horizontal spread +60%, vertical spread -70% (flat line of pellets); on the Punisher also sway +25%.
      ko: 수평 확산 +60%, 수직 확산 -70%로 산탄이 가로로 퍼짐. 퍼니셔는 흔들림 +25% 추가.
  - id: no-choke
    name:
      en: No Choke
      ko: 초크 없음
    slot: muzzle
    effect:
      en: Bare shotgun muzzle; no stat changes.
      ko: 초크를 달지 않은 상태. 능력치 변화 없음.
    icon: No_muzzle_attachment_shotgun.png
  - id: triple-lens
    name:
      en: Triple Lens
      ko: 삼중 렌즈
    slot: muzzle
    effect:
      en: "Default Sai lens: full 800 rpm with wide spread."
      ko: 사이 기본 렌즈. 800 rpm 연사, 넓은 확산.
    icon: Sai_triple_lens.png
  - id: focus-lens
    name:
      en: Focus Lens
      ko: 집속 렌즈
    slot: muzzle
    effect:
      en: Fire rate 800 -> 600 rpm, spread set to 75 (about half), less heat per second; ergonomics -6.
      ko: 연사 속도 800→600 rpm, 확산 75로 고정(약 절반), 초당 발열 감소, 인체공학성 -6.
    icon: Sai_focus_lens.png
  - id: no-underbarrel
    name:
      en: No Underbarrel
      ko: 총열 하부 없음
    slot: underbarrel
    effect:
      en: Empty underbarrel; no stat changes.
      ko: 총열 하부 부착물 없음. 능력치 변화 없음.
  - id: vertical-foregrip
    name:
      en: Vertical Foregrip
      ko: 수직 손잡이
    slot: underbarrel
    effect:
      en: Vertical recoil -20%, ergonomics -5.
      ko: 수직 반동 -20%, 인체공학성 -5.
    icon: Vertical_foregrip.png
  - id: angled-foregrip
    name:
      en: Angled Foregrip
      ko: 앵글 손잡이
    slot: underbarrel
    effect:
      en: Ergonomics +5, sway -25%, vertical recoil +20%.
      ko: 인체공학성 +5, 흔들림 -25%, 수직 반동 +20%.
    icon: Angled_foregrip.png
  - id: flashlight-vertical-foregrip
    name:
      en: Flashlight Vertical Foregrip
      ko: 조명 수직 손잡이
    slot: underbarrel
    effect:
      en: Vertical recoil -20%, ergonomics -7; adds a flashlight.
      ko: 수직 반동 -20%, 인체공학성 -7. 조명 포함.
    icon: Flashlight_vertical_foregrip.png
  - id: laser-sight
    name:
      en: Laser Sight
      ko: 레이저 조준기
    slot: underbarrel
    effect:
      en: Laser pointer aligned with the barrel; ergonomics -3.
      ko: 총열과 정렬된 레이저 포인터. 인체공학성 -3.
    icon: Lone_laser.png
  - id: laser-sight-flashlight
    name:
      en: Laser Sight W/ Flashlight
      ko: 레이저 조준기+조명
    slot: underbarrel
    effect:
      en: Laser pointer plus flashlight; ergonomics -5.
      ko: 레이저 포인터와 조명. 인체공학성 -5.
    icon: Flashlight_and_laser.png
  - id: laser-sight-angled-foregrip
    name:
      en: Laser Sight Angled Foregrip
      ko: 레이저 조준기 앵글 손잡이
    slot: underbarrel
    effect:
      en: Ergonomics +3, sway -15%, vertical recoil +20%; adds a laser pointer.
      ko: 인체공학성 +3, 흔들림 -15%, 수직 반동 +20%. 레이저 포인터 포함.
    icon: Laser_angled_foregrip.png
  - id: short-magazine
    name:
      en: Short Magazine
      ko: 짧은 탄창
    slot: magazine
    effect:
      en: Lower capacity, more spare mags, faster reload; usually ergonomics +3 to +11. Exact values vary per weapon.
      ko: 탄창 용량은 줄지만 예비 탄창이 늘고 재장전이 빨라짐. 보통 인체공학성 +3~+11. 수치는 무기마다 다름.
    icon: Liberator_short_mag.png
  - id: extended-magazine
    name:
      en: Extended Magazine
      ko: 확장 탄창
    slot: magazine
    effect:
      en: Mid-to-large box magazine (the default on many rifles); balances capacity and reload. Exact values vary per weapon.
      ko: 여러 소총의 기본 탄창인 중대형 탄창. 용량과 재장전의 균형형. 수치는 무기마다 다름.
    icon: Liberator_extended_mag.png
  - id: drum-magazine
    name:
      en: Drum Magazine
      ko: 드럼 탄창
    slot: magazine
    effect:
      en: Highest capacity, fewer spare mags, slower reload; ergonomics -10 to -15. Exact values vary per weapon.
      ko: 최대 용량. 예비 탄창이 줄고 재장전이 느려짐. 인체공학성 -10~-15. 수치는 무기마다 다름.
    icon: Liberator_drum_mag.png
  - id: standard-heatsink
    name:
      en: Standard Heatsink
      ko: 표준 방열판
    slot: magazine
    effect:
      en: Default heatsink for laser weapons.
      ko: 레이저 무기의 기본 방열판.
    icon: Standard_heaksink.png
  - id: high-capacity-heatsink
    name:
      en: High Capacity Heatsink
      ko: 고용량 방열판
    slot: magazine
    effect:
      en: Stores more heat before overheating (Scythe 100 -> 150; Sai heat per shot 1.5); ergonomics -10, fewer spares, slower swap.
      ko: 과열 전 더 많은 열을 저장(사이스 100→150, 사이는 발당 발열 1.5). 인체공학성 -10, 예비 수 감소, 교체가 느림.
    icon: High_capacity_heaksink.png
  - id: high-dissipation-heatsink
    name:
      en: High Dissipation Heatsink
      ko: 고효율 방열판
    slot: magazine
    effect:
      en: "Cools faster but stores less heat (Scythe: cap 60, cooldown 12/s; Sai: cooldown 8.5/s, ergonomics -7)."
      ko: "냉각은 빠르지만 저장 열량이 적음(사이스: 용량 60, 냉각 12/s. 사이: 냉각 8.5/s, 인체공학성 -7)."
    icon: Sai_high_dissipation_heaksink.png
weapons:
