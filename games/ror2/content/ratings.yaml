ratings:
  - id: BossDamageBonus
    rank: C
    popularity: medium
    bestFor:
      - RailgunnerBody
    verdict:
      en: Only boosts damage against bosses, so it does nothing for clearing stages; fine to scrap unless you are a boss-melting Railgunner.
      ko: 보스에게만 피해가 늘어 스테이지 정리에는 도움이 안 됩니다. 보스를 녹이는 레일거너가 아니라면 스크래퍼에 넣어도 됩니다.
  - id: SecondarySkillMagazine
    rank: A
    popularity: high
    bestFor:
      - RailgunnerBody
      - Bandit2Body
      - CaptainBody
      - HuntressBody
    verdict:
      en: Extra secondary charges are a straight damage and utility boost for survivors whose secondary is their main tool.
      ko: 보조 스킬 충전이 늘어나 보조 스킬이 주력인 생존자에게는 그대로 화력과 유틸 상승입니다.
  - id: FlatHealth
    rank: C
    popularity: medium
    bestFor:
      - FalseSonBody
    verdict:
      en: Flat +25 max health is barely felt past the early stages; only health-scaling survivors like False Son really want stacks.
      ko: 최대 체력 +25는 초반 이후 체감이 거의 없습니다. 체력에 비례해 강해지는 거짓된 자손 정도만 여러 개를 원합니다.
  - id: AttackSpeedPerNearbyAllyOrEnemy
    rank: C
    popularity: low
    bestFor:
      - MercBody
      - LoaderBody
    verdict:
      en: Gives attack speed per nearby enemy or ally (up to 3 after the V1.3.8 rework); decent in melee brawls but a Syringe is simpler.
      ko: 주변 적·아군 수만큼 공격 속도를 줍니다(V1.3.8 개편 후 최대 3명). 근접 난전에서는 쓸 만하지만 군인의 주사기가 더 확실합니다.
  - id: Firework
    rank: C
    popularity: medium
    verdict:
      en: Chest-opening fireworks help a little early and fall off quickly; take it only when nothing better is offered.
      ko: 상자를 열 때 폭죽이 나가 초반에 약간 도움이 되지만 금방 힘이 빠집니다. 더 나은 게 없을 때만 챙기세요.
  - id: Mushroom
    rank: C
    popularity: medium
    bestFor:
      - EngiBody
      - RailgunnerBody
    verdict:
      en: Standing-still healing is weak on most survivors but excellent on Engineer turrets and a scoped Railgunner.
      ko: 가만히 서 있어야 회복되어 대부분에게는 약하지만, 엔지니어 포탑과 조준 중인 레일거너에게는 아주 좋습니다.
  - id: HealWhileSafe
    rank: D
    popularity: low
    verdict:
      en: Regen only kicks in out of combat, which is exactly when you need it least.
      ko: 전투를 벗어나야 재생이 켜져서, 정작 필요한 순간에는 도움이 안 됩니다.
  - id: IncreaseDamageOnMultiKill
    rank: B
    popularity: medium
    bestFor:
      - CommandoBody
      - HuntressBody
      - ToolbotBody
    verdict:
      en: Chaining kills builds up to a solid damage bonus, so it shines on survivors that clear crowds quickly.
      ko: 연속 처치로 피해 보너스가 쌓여서 무리를 빠르게 정리하는 생존자에게 특히 좋습니다.
  - id: Crowbar
    rank: S
    popularity: very-high
    verdict:
      en: +75% damage to healthy enemies deletes fresh mobs and opens boss fights; one of the best white items to print.
      ko: 체력이 90% 이상인 적에게 피해 +75%라 새로 나온 몹을 바로 지우고 보스전 초반도 빨라집니다. 3D 프린터로 뽑을 가치가 있는 최상급 흰템입니다.
  - id: FragileDamageBonus
    rank: B
    popularity: medium
    bestFor:
      - MageBody
      - VoidSurvivorBody
    verdict:
      en: +20% damage per stack is strong, but it breaks at low health, so it suits careful or ranged players.
      ko: 스택당 피해 +20%로 강하지만 체력이 낮아지면 깨지므로 조심스럽게 싸우는 원거리 플레이에 어울립니다.
  - id: BarrierOnCooldown
    rank: B
    popularity: medium
    bestFor:
      - MageBody
      - RailgunnerBody
      - SeekerBody
    verdict:
      en: Grants barrier whenever a skill comes off cooldown, scaling with long cooldowns; better than it looks since AC made barrier decay slower.
      ko: 스킬 쿨이 돌 때마다 방벽을 주고, 기본 쿨이 긴 스킬일수록 양이 커집니다. AC 이후 방벽 감소가 느려져 생각보다 좋습니다.
  - id: SpeedBoostPickup
    rank: C
    popularity: low
    verdict:
      en: Since V1.3.7 it only gives speed through orbs you pick up; fine for mobility but not reliable.
      ko: V1.3.7 이후 바닥의 구슬을 주워야만 이동 속도를 주므로 기동성은 조금 오르지만 안정적이지 않습니다.
  - id: SprintBonus
    rank: B
    popularity: high
    bestFor:
      - LoaderBody
      - CrocoBody
      - ChefBody
    verdict:
      en: Sprint speed is always welcome and stacks well; a safe pick for any survivor that sprints a lot.
      ko: 질주 속도는 언제나 유용하고 잘 쌓입니다. 질주를 많이 하는 생존자라면 무난한 선택입니다.
  - id: NearbyDamageBonus
    rank: B
    popularity: high
    bestFor:
      - MercBody
      - LoaderBody
      - CrocoBody
      - SeekerBody
      - FalseSonBody
    verdict:
      en: +15% damage to nearby enemies is excellent for melee survivors and nearly useless for ranged ones.
      ko: 가까운 적에게 피해 +15%라 근접 생존자에게는 훌륭하고 원거리 생존자에게는 거의 쓸모가 없습니다.
  - id: IgniteOnKill
    rank: A
    popularity: high
    bestFor:
      - MageBody
      - ChefBody
      - CrocoBody
    verdict:
      en: Kill explosions spread burn through whole packs and stack efficiently; great early wave clear, even better with Ignition Tank.
      ko: 처치 시 폭발로 무리 전체에 화상을 퍼뜨리고 스택 효율도 좋습니다. 초반 웨이브 정리에 탁월하고 점화 탱크와 궁합이 좋습니다.
  - id: CritAtLowerElevation
    rank: B
    popularity: medium
    bestFor:
      - DroneTechBody
      - MageBody
      - HuntressBody
    verdict:
      en: Hitting enemies from above ramps crit chance and crit damage; strong on fliers and hover-heavy survivors, awkward on grounded melee.
      ko: 위에서 적을 때리면 치명타 확률과 치명타 피해가 쌓입니다. 공중에 오래 떠 있는 생존자에게 좋고 지상 근접에게는 애매합니다.
  - id: ScrapWhite
    rank: C
    popularity: medium
    verdict:
      en: No effect on its own; printers spend scrap first, so keep a few to trade for the white item you actually want.
      ko: 자체 효과는 없지만 3D 프린터는 재활용 아이템부터 소모하므로 원하는 흰템으로 바꿀 몇 개를 들고 다니세요.
  - id: CritGlasses
    rank: S
    popularity: very-high
    bestFor:
      - HuntressBody
      - CommandoBody
      - ToolbotBody
      - Bandit2Body
    verdict:
      en: Crit chance powers crit-synergy items like Predatory Instincts, Harvester's Scythe and Shatterspleen; always worth printing.
      ko: 치명타 확률이 포식 본능, 수확꾼의 낫, 폭발하는 비장 같은 치명타 시너지의 기반이 됩니다. 언제든 3D 프린터로 뽑을 가치가 있습니다.
  - id: Medkit
    rank: B
    popularity: medium
    bestFor:
      - TreebotBody
      - SeekerBody
    verdict:
      en: Reliable burst healing after every hit, a solid sustain item that stacks well with regen builds.
      ko: 피격 후마다 확실한 회복을 주는 안정적인 유지력 아이템으로, 재생 빌드와도 잘 어울립니다.
  - id: AttackSpeedAndMoveSpeed
    rank: B
    popularity: medium
    bestFor:
      - LoaderBody
      - MercBody
    verdict:
      en: Small attack and move speed boosts that are always useful; a safe filler white item.
      ko: 공격 속도와 이동 속도를 조금씩 올려 주는 언제나 쓸모 있는 무난한 흰템입니다.
  - id: Tooth
    rank: B
    popularity: medium
    bestFor:
      - TreebotBody
      - EngiBody
    verdict:
      en: Healing orbs from kills give free sustain in crowded fights; good early and on REX.
      ko: 처치 시 회복 구슬이 떨어져 난전에서 공짜 유지력을 줍니다. 초반과 렉스에게 좋습니다.
  - id: OutOfCombatArmor
    rank: B
    popularity: medium
    bestFor:
      - DrifterBody
    verdict:
      en: +100 armor out of combat soaks the first hit of every fight; good on burst-and-reposition playstyles.
      ko: 비전투 시 방어력 +100으로 매 전투 첫 피격을 크게 줄여 줍니다. 치고 빠지는 플레이에 좋습니다.
  - id: Hoof
    rank: A
    popularity: high
    verdict:
      en: Flat movement speed that also works in combat; mobility is survival in RoR2, so stack it freely.
      ko: 전투 중에도 적용되는 이동 속도라 리스크 오브 레인에서 곧 생존력입니다. 부담 없이 쌓으세요.
  - id: PersonalShield
    rank: C
    popularity: medium
    bestFor:
      - VoidSurvivorBody
      - HereticBody
    verdict:
      en: A small shield that only matters on shield or Transcendence builds, or with Plasma Shrimp.
      ko: 작은 보호막이라 보호막/초월 빌드나 플라즈마 새우와 함께일 때만 의미가 있습니다.
  - id: HealingPotion
    rank: C
    popularity: medium
    bestFor:
      - TreebotBody
    verdict:
      en: A one-time emergency heal per stage per stack; it can save a run but is consumed and gives nothing afterward.
      ko: 스테이지마다 한 번 위급할 때 회복해 주지만 사용 후에는 아무 효과가 없습니다.
  - id: ArmorPlate
    rank: C
    popularity: medium
    bestFor:
      - TreebotBody
      - SeekerBody
    verdict:
      en: Flat damage reduction per hit is strong against swarms of weak hits but falls off against big hits in loops.
      ko: 피격당 고정 피해 감소라 약한 다단히트에는 강하지만 루프 후반의 큰 한 방에는 약해집니다.
  - id: GoldOnHurt
    rank: D
    popularity: low
    verdict:
      en: A little gold when hit is negligible; scrap it.
      ko: 맞을 때 들어오는 약간의 골드는 의미가 거의 없습니다. 스크래퍼로 보내세요.
  - id: TreasureCache
    rank: C
    popularity: medium
    verdict:
      en: Spawns a locked rusty box each stage with a chance at greens and reds; fine for looping, weak for a quick run.
      ko: 스테이지마다 녹슨 잠금 상자가 생겨 초록·빨간템을 노릴 수 있습니다. 루프에는 괜찮지만 짧은 런에는 약합니다.
  - id: Syringe
    rank: S
    popularity: very-high
    bestFor:
      - CommandoBody
      - ToolbotBody
      - HuntressBody
    verdict:
      en: +15% attack speed per stack boosts damage and every on-hit proc; the most reliable white item for nearly everyone.
      ko: 스택당 공격 속도 +15%로 화력과 모든 적중 시 프록을 함께 올립니다. 거의 모든 생존자에게 가장 확실한 흰템입니다.
  - id: StickyBomb
    rank: B
    popularity: medium
    bestFor:
      - CommandoBody
      - CaptainBody
    verdict:
      en: A reliable on-hit bomb for 180% damage that scales with procs; solid filler for fast-hitting survivors.
      ko: 적중 시 확률로 폭탄을 붙이는 믿을 만한 프록 아이템으로, 타수가 많은 생존자에게 무난합니다.
  - id: StunChanceOnHit
    rank: C
    popularity: medium
    verdict:
      en: Random stuns are nice crowd control, but hyperbolic stacking and useless against bosses keep it low.
      ko: 무작위 기절은 군중 제어로 괜찮지만 쌍곡선 스택이고 보스에게는 통하지 않아 평가가 낮습니다.
  - id: BarrierOnKill
    rank: B
    popularity: medium
    bestFor:
      - TreebotBody
      - HereticBody
      - VoidSurvivorBody
    verdict:
      en: Barrier on kill gives steady mid-fight protection, and the AC barrier-decay change made it better.
      ko: 처치 시 방벽으로 전투 중 꾸준히 버틸 수 있고, AC의 방벽 감소 변경으로 더 좋아졌습니다.
  - id: Bear
    rank: S
    popularity: very-high
    verdict:
      en: Chance to fully block a hit stacks into huge survivability; the best defensive white and usually worth keeping over its void form.
      ko: 피격을 확률로 완전히 막아 주고 스택할수록 생존력이 크게 오릅니다. 최고의 방어 흰템이라 공허 버전보다 유지할 때가 많습니다.
  - id: BleedOnHit
    rank: A
    popularity: high
    bestFor:
      - CommandoBody
      - ToolbotBody
      - CaptainBody
      - Bandit2Body
    verdict:
      en: Bleed on every hit gives strong boss damage on fast-hitting survivors; stacks well into loops.
      ko: 적중마다 출혈 확률이 있어 타수가 많은 생존자의 보스 화력이 크게 늘고, 루프까지 잘 스택됩니다.
  - id: WardOnLevel
    rank: C
    popularity: medium
    verdict:
      en: A banner on level-up and teleporter start helps boss fights a little; filler.
      ko: 레벨업과 텔레포터 시작 시 깃발을 세워 보스전에 약간 도움이 되는 무난한 수준입니다.
  - id: DelayedDamage
    rank: C
    popularity: low
    verdict:
      en: V1.4.1 cut its damage reduction to 10%, so it now mostly smooths big hits over time rather than preventing damage.
      ko: V1.4.1에서 피해 감소가 10%로 줄어, 이제는 피해를 막기보다 큰 한 방을 나눠 받게 해 주는 정도입니다.
  - id: Missile
    rank: S
    popularity: very-high
    verdict:
      en: A reliable 300% missile on hit that works on every survivor and scales with every proc chain; one of the best greens.
      ko: 적중 시 300% 미사일을 쏘는 믿을 만한 프록 아이템으로, 모든 생존자와 프록 연쇄에 어울리는 최상급 초록템입니다.
  - id: Bandolier
    rank: B
    popularity: medium
    bestFor:
      - Bandit2Body
      - EngiBody
      - CaptainBody
      - HereticBody
    verdict:
      en: Ammo pack drops reset cooldowns, which is great for cooldown-limited survivors.
      ko: 처치 시 탄약 상자가 떨어져 쿨이 초기화되어 쿨타임에 묶인 생존자에게 좋습니다.
  - id: WarCryOnMultiKill
    rank: B
    popularity: medium
    bestFor:
      - MercBody
      - ToolbotBody
    verdict:
      en: Multi-kills trigger a big attack and move speed frenzy; strong on AoE and wave-clear survivors.
      ko: 다중 처치 시 공격·이동 속도가 크게 오르는 광란 상태가 되어 광역딜 생존자에게 좋습니다.
  - id: DronesDropDynamite
    rank: C
    popularity: medium
    bestFor:
      - DroneTechBody
      - CaptainBody
    verdict:
      en: Gives a dynamite-dropping drone and makes your drones drop dynamite; handy for Operator drone builds but minor elsewhere.
      ko: 다이너마이트를 떨어뜨리는 드론을 주고 내 드론들도 폭탄을 떨굽니다. 오퍼레이터 드론 빌드에는 좋지만 그 외에는 소소한 보탬입니다.
  - id: KnockBackHitEnemies
    rank: C
    popularity: low
    verdict:
      en: Launches grounded enemies for juggle damage, but the V1.3.7 nerf and aim disruption keep it niche.
      ko: 지상의 적을 띄워 추가 피해를 주지만 V1.3.7 너프와 조준 방해 때문에 쓰임새가 좁습니다.
  - id: ExtraShrineItem
    rank: B
    popularity: medium
    verdict:
      en: Better Shrine of Chance rewards, with a chance to upgrade the item's rarity; good if you gamble with gold anyway.
      ko: 확률의 성소 보상이 좋아지고 등급이 오를 확률도 생깁니다. 골드로 성소를 자주 돌린다면 좋습니다.
  - id: SlowOnHit
    rank: B
    popularity: medium
    verdict:
      en: A 60% slow on hit makes every fight safer with just one copy; extra copies only lengthen the slow.
