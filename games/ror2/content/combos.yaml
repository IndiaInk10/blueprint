        target: 1
      - id: ExecuteLowHealthElite
        target: 3
      - id: KillEliteFrenzy
        target: 1
      - id: MinorConstructOnKill
        target: 1
      - id: ItemDropChanceOnKill
        target: 1
      - id: BossDamageBonus
        target: 5
      - id: Crowbar
        target: 3
    equipment: BossHunter
