combos:
  - id: proc-fireworks
    focus: items
    title:
      en: Proc Fireworks
      ko: 프록 폭죽놀이
    tagline:
      en: Stack every on-hit proc item and fill the screen with lightning, missiles and bombs.
      ko: 프록 아이템만 몰아서 화면을 폭죽으로 채우는 빌드
    summary:
      en: Print Soldier's Syringe and Sticky Bomb early so you get more hits and more rolls. Funnel green scrap into Ukulele and AtG Missile printers; once a 57 Leaf Clover shows up the chains become obvious. Skip Void Cradles, since they turn Ukulele and AtG into their void versions.
      ko: 초반엔 군인의 주사기와 끈끈이 폭탄을 3D 프린터로 뽑아 공격 횟수와 발동 횟수부터 늘립니다. 녹색 재활용 아이템은 우쿨렐레와 AtG 미사일 Mk. 1 프린터에 몰아주고, 57잎 클로버가 뜨면 그때부터 연쇄가 눈에 띄게 터집니다. 공허 요람은 우쿨렐레와 AtG를 공허 버전으로 바꿔 버리니 열지 않는 게 좋습니다.
    whyFun:
      en: Every shot sets off lightning and missiles, so the screen never goes quiet.
      ko: 총 한 번 쏠 때마다 번개랑 미사일이 같이 튀어나가서 화면이 쉴 틈이 없습니다.
    survivors:
      - CommandoBody
      - ToolbotBody
      - HuntressBody
      - EngiBody
    items:
      - id: ChainLightning
        target: 4
      - id: Missile
        target: 4
      - id: StickyBomb
        target: 5
      - id: Syringe
        target: 5
        note:
          en: More hits per second means more proc rolls.
          ko: 공격 횟수가 곧 발동 횟수입니다.
      - id: Clover
        target: 2
      - id: MoreMissile
        target: 1
      - id: StunAndPierce
        target: 2
    avoid:
      - ChainLightningVoid
      - MissileVoid
      - CloverVoid
      - LunarBadLuck
    tags:
      - theme
      - chaos
      - team
  - id: bleed-stack
    focus: items
    title:
      en: Bleed Stacker
      ko: 출혈 누적
    tagline:
      en: Tri-Tip Daggers until everything bleeds out, then spread the bleed on kill.
      ko: 삼각 단검을 모아서 적을 출혈로 말려 죽이는 조합
    summary:
      en: Ten Tri-Tip Daggers give a 100% bleed chance, so print them at every white printer. Shatterspleen bleeds on crits, so pair it with Lens-Maker's Glasses; Noxious Thorn passes a share of the stacked bleed to a nearby enemy on kill. Avoid Void Cradles that could give Needletick.
      ko: 삼각 단검은 10개면 출혈 확률이 100%가 되니 흰색 3D 프린터가 보이면 우선 뽑습니다. 폭발하는 비장은 치명타로 출혈을 거는 아이템이라 렌즈 제작자의 안경과 같이 가져가고, 독가시가 있으면 적을 처치할 때 쌓여 있던 출혈 일부가 옆 적에게 넘어갑니다. 니들틱이 나올 수 있는 공허 요람은 피합니다.
    whyFun:
      en: Bleed numbers pile up, then the target pops and the bleed jumps to the next one.
      ko: 출혈 숫자가 겹겹이 쌓이다가 적이 터지면서 옆 적한테 번지는 게 보기 좋습니다.
    survivors:
      - Bandit2Body
      - MercBody
      - CommandoBody
    items:
      - id: BleedOnHit
        target: 10
        note:
          en: 10 stacks = 100% bleed chance.
          ko: 10개면 출혈 확률 100%입니다.
      - id: BleedOnHitAndExplode
        target: 1
        note:
          en: Bleeds on crit, bleeding enemies explode on death.
          ko: 치명타 시 출혈, 출혈 중인 적이 죽으면 터집니다.
      - id: TriggerEnemyDebuffs
        target: 2
      - id: CritGlasses
        target: 5
      - id: Syringe
        target: 4
      - id: AttackSpeedOnCrit
        target: 1
    avoid:
      - BleedOnHitVoid
    tags:
      - theme
      - solo
  - id: kill-chain
    focus: items
    title:
      en: Chain Explosions
      ko: 처치 연쇄 폭발
    tagline:
      en: "On-kill items only: one kill blows up and ignites the whole pack."
      ko: 처치할 때마다 폭발과 불이 옆 적에게 옮겨붙는 조합
    summary:
      en: Print Will-o'-the-wisp and Gasoline as much as you can and use Ignition Tank to make the Gasoline fire hurt. It shines during teleporter events when packs are dense; Frost Relic or Brainstalks make clears much faster. A Void Cradle can turn your wisps into Voidsent Flame, so decide before you open one.
      ko: 도깨비불과 휘발유를 흰색·녹색 3D 프린터로 최대한 늘리고, 점화 탱크로 휘발유 불의 피해를 키웁니다. 적이 몰려오는 텔레포터 이벤트 때 가장 잘 돌아가고, 서리 유물이나 뇌줄기가 붙으면 정리 속도가 확 올라갑니다. 공허 요람을 열면 도깨비불이 공허가 보낸 화염으로 바뀔 수 있으니 열기 전에 방향을 정합니다.
    whyFun:
      en: Kill the first enemy and the rest of the room goes off on its own.
      ko: 첫 한 마리만 잡으면 나머지가 알아서 터져서 방 하나가 금방 비는 게 시원합니다.
    survivors:
      - HuntressBody
      - MageBody
      - ToolbotBody
    items:
      - id: ExplodeOnDeath
        target: 5
        note:
          en: If a Voidsent Flame shows up, you can switch the whole build to it instead.
          ko: 공허가 보낸 화염이 나오면 도깨비불 대신 그쪽으로 통째로 바꾸는 것도 방법입니다.
      - id: IgniteOnKill
        target: 5
      - id: StrengthenBurn
        target: 2
      - id: IncreaseDamageOnMultiKill
        target: 5
      - id: Icicle
        target: 1
      - id: KillEliteFrenzy
        target: 1
      - id: TriggerEnemyDebuffs
        target: 1
    equipment: Molotov
    avoid:
      - ExplodeOnDeathVoid
    tags:
      - theme
      - chaos
      - team
  - id: crit-scythe
    focus: items
    title:
      en: Crit Lifesteal
      ko: 치명타 흡혈
    tagline:
      en: Hit 100% crit, then let Harvester's Scythe heal you on every hit.
      ko: 치명타 확률을 100% 채우고 수확꾼의 낫으로 체력을 채우는 빌드
    summary:
      en: Nine Lens-Maker's Glasses plus one Harvester's Scythe reach 100% crit, so turn white scrap into glasses. After that, each extra Scythe adds healing per hit and Predatory Instincts adds attack speed. Railgunner only crits on weak points, so she does not fit.
      ko: 렌즈 제작자의 안경 9개에 수확꾼의 낫 1개면 치명타 확률이 100%가 되니 흰색 재활용 아이템은 전부 안경으로 바꿉니다. 그다음부터는 수확꾼의 낫을 늘릴수록 한 발마다 회복량이 붙고, 포식 본능으로 공격 속도도 같이 올라갑니다. 레일거너는 약점을 맞힐 때만 치명타가 나서 이 조합과 잘 맞지 않습니다.
    whyFun:
      en: The faster you shoot the faster you heal, so you can stand in the fight and trade.
      ko: 공격 속도가 오를수록 체력이 계속 차올라서 맞으면서 싸워도 잘 안 죽습니다.
    survivors:
      - CommandoBody
      - HuntressBody
      - MercBody
    items:
      - id: CritGlasses
        target: 9
        note:
          en: 9 glasses + 1 scythe = 100% crit.
          ko: 안경 9개에 낫 1개면 100%입니다.
      - id: HealOnCrit
        target: 3
      - id: AttackSpeedOnCrit
        target: 2
      - id: CritDamage
        target: 1
      - id: CritAtLowerElevation
        target: 5
        note:
          en: Only while attacking from above the enemy.
          ko: 적보다 높은 곳에서 공격할 때만 적용됩니다.
      - id: Syringe
        target: 5
    equipment: CritOnUse
    avoid:
      - CritGlassesVoid
    tags:
      - theme
      - solo
  - id: transcendence-shield
    focus: items
    title:
      en: Transcendence Shields
      ko: 초월 방어막
    tagline:
      en: Turn all your health into shield and stack shield items on top.
      ko: 체력을 전부 방어막으로 바꾸고 방어막 아이템을 쌓는 조합
    summary:
      en: You need only one Transcendence from a Lunar Pod; it drops you to 1 HP, so collect some Personal Shield Generators and Bison Steaks first. Shields refill all at once after a few seconds without damage, so play hit-and-run; with Aegis, any overheal becomes barrier. Kinetic Dampener releases a shock pulse when the shield breaks, so it also adds damage here.
      ko: 초월은 루나 포드에서 하나만 얻으면 되고, 먹는 순간 체력이 1이 되니 그 전에 개인용 방어막 생성기와 들소 스테이크를 어느 정도 모아 둡니다. 방어막은 몇 초 동안 맞지 않으면 한 번에 다 차기 때문에 치고 빠지는 운영이 맞고, 방패를 얻으면 넘치는 회복량이 장벽으로 바뀌어 훨씬 단단해집니다. 운동량 감쇠기는 방어막이 깨질 때 마비 펄스를 터뜨려 줘서 이 빌드에서는 딜 역할도 합니다.
    whyFun:
      en: Watching the shield break and snap back to full over and over is oddly addictive.
      ko: 방어막이 깨졌다가 순식간에 다시 차는 걸 반복하면서 버티는 게 은근히 중독성 있습니다.
    survivors:
      - LoaderBody
      - EngiBody
    items:
      - id: ShieldOnly
        target: 1
        note:
          en: One is enough.
          ko: 하나면 충분합니다.
      - id: PersonalShield
        target: 6
      - id: ShieldBooster
        target: 3
      - id: FlatHealth
        target: 5
        note:
          en: Max health becomes shield.
          ko: 최대 체력이 그대로 방어막이 됩니다.
      - id: Knurl
        target: 2
      - id: CookedSteak
        target: 1
        note:
          en: Cooked by the Wandering CHEF.
          ko: 떠돌이 셰프에게서 만듭니다.
      - id: BarrierOnOverHeal
        target: 2
      - id: BarrierOnCooldown
        target: 4
    avoid:
      - LunarDagger
    tags:
      - theme
      - long-run
  - id: unkillable-tank
    focus: items
    title:
      en: Unkillable Tank
      ko: 안 죽는 탱커
    tagline:
      en: Tougher Times, armor plates and armor items until nothing can kill you.
      ko: 힘들었던 시절과 방어 아이템을 쌓아서 맞아도 안 죽는 빌드
    summary:
      en: Tougher Times blocks hits by chance and Repulsion Armor Plate removes a flat amount from every hit, so print both at white printers early. Stone Flux Pauldron doubles health but halves speed, which suits survivors who fight up close. Opening a Void Cradle with Safer Spaces converts all your Tougher Times.
      ko: 힘들었던 시절은 확률로 피해를 막고 반발성 방어구 철판은 받는 피해를 고정 수치만큼 깎아 주니, 초반에 흰색 3D 프린터로 둘 다 늘리는 게 핵심입니다. 돌의 흐름 견갑은 체력이 두 배가 되는 대신 이동 속도가 절반이 되니 적에게 붙어 싸우는 생존자와 맞습니다. 더 안전한 공간이 든 공허 요람을 열면 힘들었던 시절이 전부 바뀌니 주의합니다.
    whyFun:
      en: Standing in the middle of a Monsoon boss fight and barely losing health is pretty funny.
      ko: 몬순에서 보스 한가운데 서 있어도 체력이 거의 안 빠지는 걸 보면 웃깁니다.
    survivors:
      - ToolbotBody
      - LoaderBody
      - CrocoBody
    items:
      - id: Bear
        target: 8
      - id: ArmorPlate
        target: 10
      - id: SprintArmor
        target: 3
      - id: OutOfCombatArmor
        target: 5
      - id: DelayedDamage
        target: 3
      - id: HalfSpeedDoubleHealth
        target: 1
        note:
          en: Double health, half move speed.
          ko: 체력 두 배, 이동 속도 절반입니다.
      - id: Knurl
        target: 3
      - id: BarrierOnOverHeal
        target: 1
      - id: ExtraLife
        target: 1
    equipment: GainArmor
    avoid:
      - BearVoid
      - LunarDagger
    tags:
      - theme
      - long-run
      - team
  - id: ally-army
    focus: items
    title:
      en: Summoner Army
      ko: 소환수 군단
    tagline:
      en: "Pick up every ally-summoning item: Queen's Gland, Empathy Cores, Squid Polyp and friends."
      ko: 여왕의 분비샘, 공감 코어 같은 아군 소환 아이템을 몰아 받는 조합
    summary:
      en: Queen's Gland and Empathy Cores are boss items, so get them from teleporter bosses or Overgrown 3D Printers. Squid Polyp spawns a turret on every interaction, so touch every chest, shrine and drone; Defense Nucleus adds an Alpha Construct whenever you kill an elite. Bolstering Lantern counts nearby allies, so it grows with the army.
      ko: 여왕의 분비샘과 공감 코어는 보스 아이템이라 텔레포터 보스를 잡거나 과성장 3D 프린터에서 얻습니다. 오징어 폴립은 상자, 성소, 드론 같은 걸 건드릴 때마다 포탑을 소환하니 상호작용을 많이 할수록 좋고, 방어 핵은 엘리트를 잡을 때마다 알파급 인공지능을 붙여 줍니다. 강화의 등불은 근처 아군 수도 세기 때문에 소환수가 늘수록 효과가 커집니다.
    whyFun:
      en: Later on beetles, probes and squids follow you around and do the fighting for you.
      ko: 나중엔 딱정벌레, 탐사정, 오징어 포탑이 우르르 따라다니면서 알아서 싸워 줘서 든든합니다.
    items:
      - id: BeetleGland
        target: 3
      - id: RoboBallBuddy
        target: 1
      - id: Squid
        target: 5
      - id: MinorConstructOnKill
        target: 1
      - id: GhostOnKill
        target: 1
      - id: AttackSpeedPerNearbyAllyOrEnemy
        target: 3
        note:
          en: Counts nearby allies too.
          ko: 근처 아군 수도 셉니다.
      - id: WardOnLevel
        target: 2
    equipment: GummyClone
    tags:
      - theme
      - solo
      - long-run
  - id: freeze-control
    focus: items
    title:
      en: Freeze & Slow Control
      ko: 빙결·감속 제어
    tagline:
      en: Slow, stun and freeze enemies so they never reach you.
      ko: 적을 느리게 만들고 묶어서 가까이 못 오게 하는 제어 빌드
    summary:
      en: Runald's Band triggers on big single hits, so survivors with a heavy skill fit best; Chronobauble and Frost Relic slow the pack while Stun Grenade and Breaching Fin keep it locked down. Pull everything together with Primordial Cube, then freeze it with Artificer or CHEF skills. Skip Void Cradles offering Singularity Band or Tentabauble.
      ko: 루널드의 반지는 한 번에 큰 피해를 줄 때 발동하니 한 방이 센 스킬이 있는 생존자가 좋고, 시간의 방울과 서리 유물로 느려진 적을 마비 수류탄과 돌파 지느러미로 계속 묶어 둡니다. 태고의 큐브로 적을 한데 모은 다음 아티피셔나 셰프의 스킬로 얼리면 정리가 훨씬 편합니다. 특이점 반지나 촉수 방울이 든 공허 요람은 반지와 방울을 바꿔 버리니 피합니다.
    whyFun:
      en: Enemies crawl toward you and freeze before they arrive, so even Monsoon feels relaxed.
      ko: 적이 다가오기도 전에 느려지고 멈춰 버려서 몬순에서도 여유 있게 싸울 수 있습니다.
    survivors:
      - MageBody
      - ChefBody
    items:
      - id: IceRing
        target: 3
      - id: SlowOnHit
        target: 3
      - id: Icicle
        target: 1
      - id: StunChanceOnHit
        target: 5
      - id: KnockBackHitEnemies
        target: 2
      - id: StunAndPierce
        target: 1
    equipment: Blackhole
    avoid:
      - SlowOnHitVoid
      - ElementalRingVoid
    tags:
      - theme
      - team
  - id: regen-to-damage
    focus: items
    title:
      en: Healing Into Damage
      ko: 회복 딜러
    tagline:
      en: Stack healing and regen, then turn the overflow into damage with Hearty Stew and N'kuhana's Opinion.
      ko: 체력 회복 아이템을 쌓아서 회복량을 그대로 공격으로 돌리는 빌드
    summary:
      en: Hearty Stew is a Wandering CHEF recipe; at full health your regen is added to base damage. N'kuhana's Opinion stores healing and fires it as skulls, so Leeching Seed and Rejuvenation Rack turn into damage on their own. Early on, lean on Bustling Fungus and Cautious Slug while you wait for red items.
      ko: 든든한 스튜는 떠돌이 셰프에게 재료를 넘겨 만드는 요리로, 체력이 가득 찬 상태에서는 체력 회복량이 기본 피해에 더해집니다. 은쿠하나의 견해는 받은 회복량을 모았다가 해골로 쏘기 때문에 흡혈 씨앗과 회춘의 선반으로 회복량을 불려 두면 알아서 딜이 나옵니다. 초반엔 뿜뿜 버섯과 신중한 민달팽이로 버티면서 빨간 아이템을 기다리면 됩니다.
    whyFun:
      en: You mostly just heal, and skulls fly out and melt things anyway.
      ko: 체력만 채우고 있어도 해골이 날아가서 적이 녹는 게 신기합니다.
    survivors:
      - ToolbotBody
      - CommandoBody
      - CrocoBody
    items:
      - id: Stew
        target: 2
        note:
          en: Cooked by the Wandering CHEF.
          ko: 떠돌이 셰프에게서 만듭니다.
      - id: NovaOnHeal
        target: 1
      - id: IncreaseHealing
        target: 2
      - id: Seed
        target: 3
      - id: Mushroom
        target: 3
      - id: HealWhileSafe
        target: 3
      - id: Medkit
        target: 3
      - id: TPHealingNova
        target: 1
    equipment: PassiveHealing
    avoid:
      - LunarDagger
    tags:
      - theme
      - long-run
  - id: elite-hunter
    focus: items
    title:
      en: Elite Hunter
      ko: 엘리트 사냥꾼
    tagline:
      en: "Wake of Vultures plus every elite-kill reward: steal aspects, execute elites, farm items."
      ko: 엘리트를 잡을수록 그 능력을 빼앗아 오는 독수리 무리 중심 조합
    summary:
      en: Wake of Vultures gives you an elite's aspect for a while when you kill it, so it comes alive in later loops or with Artifact of Honor on. Old Guillotine finishes low-health elites instantly, and Brainstalks and Defense Nucleus stack more rewards on each elite kill. Carry Trophy Hunter's Tricorn to delete a teleporter boss and take its boss item.
      ko: 독수리 무리는 엘리트를 처치하면 그 엘리트의 능력을 잠깐 얻는 아이템이라, 엘리트가 많이 나오는 후반 루프나 명예의 유물을 켠 판에서 제대로 돌아갑니다. 낡은 단두대로 체력이 낮은 엘리트를 바로 끝내고, 뇌줄기와 방어 핵으로 엘리트 처치 보상을 겹쳐 받습니다. 장비는 트로피 헌터의 삼각모자를 들고 있다가 텔레포터 보스를 한 번에 처리해 보스 아이템을 챙깁니다.
    whyFun:
      en: After a few elite kills you're wearing fire, lightning and ice auras at the same time.
      ko: 엘리트 몇 마리만 잡아도 불, 번개, 얼음 능력을 한꺼번에 두르고 다니게 됩니다.
    survivors:
