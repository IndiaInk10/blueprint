  - id: teleporter-rush
    focus: challenge
    title:
      en: Teleporter Rush
      ko: 텔레포터 러시
    tagline:
      en: Barely open chests and sprint straight to the teleporter before difficulty catches up.
      ko: 상자는 거의 안 열고 텔레포터로 곧장 달려가는 속도전
    summary:
      en: Find the teleporter first on every stage and only grab chests and printers on the way. Focused Convergence charges the teleporter faster in a smaller zone, and Red Whip and Energy Drink cut travel time. Difficulty rises with time, so the faster you go the weaker the enemies stay; that is the whole point.
      ko: 스테이지에 들어가면 텔레포터 위치부터 찾고, 가는 길에 있는 상자와 3D 프린터만 챙깁니다. 집중 충전은 텔레포터 범위를 좁히는 대신 충전을 빠르게 해 주고, 빨간 채찍과 에너지 드링크로 이동 시간을 줄입니다. 난이도가 시간에 따라 오르니 빨리 갈수록 적이 약한 상태로 남는다는 게 이 도전의 핵심입니다.
    whyFun:
      en: Reaching stage five before the timer hits ten minutes feels great.
      ko: 타이머가 10분도 안 됐는데 다섯 번째 스테이지에 와 있으면 기분이 좋습니다.
    survivors:
      - LoaderBody
      - HuntressBody
      - MercBody
    items:
      - id: FocusConvergence
        target: 3
        note:
          en: Faster charge, smaller zone.
          ko: 충전은 빨라지고 범위는 좁아집니다.
      - id: SprintOutOfCombat
        target: 2
      - id: SprintBonus
        target: 5
      - id: Hoof
        target: 3
      - id: Feather
        target: 2
      - id: TitanGoldDuringTP
