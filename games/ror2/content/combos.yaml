    summary:
      en: Void Fiend gains corruption from taking damage, landing crits and holding void items, and at full corruption his skills turn into their aggressive forms. Lens-Maker's Glasses and a stack of void items fill the gauge fast so you can stay in that form longer. Healing lowers corruption, so skip automatic healing like Leeching Seed or Harvester's Scythe.
      ko: 공허 악마는 피해를 받거나 치명타를 넣거나 공허 아이템을 들고 있으면 오염이 차고, 오염이 가득 차면 스킬이 더 공격적인 형태로 바뀝니다. 렌즈 제작자의 안경으로 치명타를 늘리고 공허 아이템을 모아 오염이 빨리 차게 만들면 강화 상태를 오래 유지할 수 있습니다. 치유는 오염을 줄이니 흡혈 씨앗이나 수확꾼의 낫처럼 저절로 회복되는 아이템은 피합니다.
