      - long-run
  - id: feather-flight
    focus: items
    title:
      en: Twenty Feathers
      ko: 깃털 스무 개
    tagline:
      en: Collect twenty-plus Hopoo Feathers and barely touch the ground.
      ko: Hopoo 깃털을 스무 개 넘게 모아서 땅을 거의 안 밟고 다니는 빌드
    summary:
      en: Hopoo Feather is green, so put all your green scrap into a Feather printer. Wax Quail and Faraday Spur stretch every jump, and Hiker's Boots rewards attacking from above, which fits aerial fights. Land with H3AD-5T v2 so even coming down deals damage.
      ko: Hopoo 깃털은 녹색 아이템이라 녹색 재활용 아이템을 전부 깃털 프린터에 넣는 식으로 모읍니다. 밀랍 메추라기와 패러데이 박차로 점프 거리를 늘리고, 하이커 장화는 적보다 높은 곳에서 공격할 때 치명타가 붙어서 공중전과 잘 맞습니다. 내려올 때 H3AD-5T v2로 찍으면 착지하면서도 딜이 들어갑니다.
    whyFun:
      en: Holding jump carries you from one end of the map to the other, so just moving around is fun.
      ko: 점프만 누르고 있으면 맵 끝에서 끝까지 날아가서 이동하는 것 자체가 재밌습니다.
