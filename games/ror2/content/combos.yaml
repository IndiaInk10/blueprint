          en: Upgrades a few items each stage.
          ko: 스테이지마다 아이템 몇 개를 한 단계 올려 줍니다.
      - id: ElementalRingVoid
        target: 2
      - id: BearVoid
        target: 3
      - id: ExplodeOnDeathVoid
        target: 3
      - id: ExtraLifeVoid
        target: 1
