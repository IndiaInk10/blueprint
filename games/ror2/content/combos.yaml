      - id: Behemoth
        target: 1
      - id: BarrageOnBoss
        target: 1
    equipment: Gateway
    avoid:
      - HalfSpeedDoubleHealth
    tags:
      - challenge
      - solo
  - id: debuff-stacker
    focus: items
    title:
      en: Debuff Stacker
      ko: 디버프 몰아주기
    tagline:
      en: Pile four or more different debuffs on enemies to trigger Death Mark.
      ko: 디버프를 네 개 이상 쌓아서 죽음의 표식을 띄우는 조합
    summary:
      en: "Death Mark marks enemies with four or more debuffs so they take much more damage, so the goal is several different debuffs: bleed, slow, armor reduction, burn. Tri-Tip Dagger and Chronobauble lay the base, and Symbiotic Scorpion and Shattering Justice strip armor on top. Survivors whose skills already poison or weaken, like Acrid or REX, hit the threshold much faster."
      ko: 죽음의 표식은 디버프가 4개 이상 걸린 적에게 표식을 붙여 받는 피해를 크게 늘리니, 출혈, 감속, 방어력 감소, 화상처럼 종류가 다른 디버프를 여러 개 거는 게 핵심입니다. 삼각 단검과 시간의 방울로 기본 디버프를 깔고 공생 전갈과 부서진 정의로 방어력까지 깎습니다. 애크리드나 렉스처럼 스킬 자체에 독이나 약화가 붙은 생존자면 조건을 훨씬 빨리 채웁니다.
    whyFun:
      en: Debuff icons line up over an enemy's head and the moment the mark lands its health drops fast.
      ko: 적 머리 위에 디버프 아이콘이 줄줄이 붙다가 표식이 뜨는 순간 체력이 쑥 빠집니다.
    survivors:
      - CrocoBody
      - TreebotBody
    items:
      - id: DeathMark
        target: 1
        note:
          en: Needs 4+ debuffs on the target.
          ko: 대상에게 디버프가 4개 이상 있어야 합니다.
      - id: BleedOnHit
        target: 3
      - id: SlowOnHit
        target: 2
      - id: PermanentDebuffOnHit
        target: 1
      - id: ArmorReductionOnHit
        target: 1
      - id: TriggerEnemyDebuffs
        target: 2
      - id: FireRing
        target: 1
    equipment: CrippleWard
    avoid:
      - SlowOnHitVoid
      - BleedOnHitVoid
    tags:
      - theme
      - team
  - id: missile-barrage
    focus: items
    title:
      en: Missile Barrage
      ko: 미사일 폭격
    tagline:
      en: AtG Missiles and Pocket I.C.B.M. until the sky is full of missiles.
      ko: AtG 미사일과 포켓 I.C.B.M.으로 하늘을 미사일로 덮는 조합
    summary:
      en: Collect AtG Missile Mk. 1 at green printers; once Pocket I.C.B.M. arrives each proc fires three missiles and the count jumps. Disposable Missile Launcher also benefits from Pocket I.C.B.M., and Spare Drone Parts makes your drones fire missiles too. Avoid Void Cradles with Plasma Shrimp, which would replace your AtGs.
      ko: AtG 미사일 Mk. 1을 녹색 3D 프린터로 모으고, 포켓 I.C.B.M.을 얻으면 미사일이 한 번에 세 발씩 나가면서 수가 확 늘어납니다. 일회용 미사일 발사기도 포켓 I.C.B.M.의 효과를 받고, 드론 예비 부품이 있으면 드론도 미사일을 쏩니다. 플라즈마 새우가 든 공허 요람은 AtG를 바꿔 버리니 피합니다.
    whyFun:
      en: So many missiles fly that you can't tell what they're hitting; enemies just vanish.
      ko: 미사일 연기가 화면을 덮을 만큼 날아가서 뭘 맞히는지도 모르게 적이 사라집니다.
    survivors:
      - EngiBody
      - CommandoBody
      - ToolbotBody
    items:
      - id: Missile
        target: 5
      - id: MoreMissile
        target: 2
        note:
          en: Every missile item fires extra missiles.
          ko: 미사일 아이템이 전부 추가 미사일을 쏩니다.
      - id: BarrageOnBoss
        target: 1
      - id: DroneWeapons
        target: 1
      - id: Clover
        target: 1
      - id: Syringe
        target: 4
    equipment: CommandMissile
    avoid:
      - MissileVoid
    tags:
      - theme
      - chaos
  - id: team-support
    focus: items
    title:
      en: Team Support
      ko: 팀 서포터
    tagline:
      en: Warbanner, Lepton Daisy and other items that power up the whole team.
      ko: 전쟁깃발과 렙톤 데이지처럼 팀 전체를 챙기는 아이템을 모으는 조합
    summary:
      en: Warbanner plants a banner on level-up and teleporter events that speeds up nearby allies, and Lepton Daisy heals the whole team while the teleporter charges. Faulty Conductor and Gorag's Opus buff allies around you, and Empathy Cores get stronger with every teammate. Bustling Fungus heals anyone standing in it, so it suits a party that groups up inside the teleporter.
      ko: 전쟁깃발은 레벨업이나 텔레포터 이벤트 때 깃발을 세워 주변 아군의 공격·이동 속도를 올리고, 렙톤 데이지는 텔레포터 충전 중 팀 전체를 회복시킵니다. 결함 있는 전도체와 고라그의 작품도 주위 아군을 같이 강화하고, 공감 코어는 팀원이 많을수록 탐사정이 세집니다. 뿜뿜 버섯은 범위 안의 팀원도 같이 회복시키니 텔레포터 안에서 뭉쳐 싸우는 파티와 잘 맞습니다.
    whyFun:
      en: Your own damage is modest, but you can see everyone around you get much stronger.
      ko: 내 딜은 적어도 옆 사람들이 확 세지는 게 보여서 멀티에서 은근히 뿌듯합니다.
    items:
      - id: WardOnLevel
        target: 3
      - id: TPHealingNova
        target: 2
      - id: ShockDamageAura
        target: 1
      - id: RoboBallBuddy
        target: 1
      - id: Mushroom
        target: 3
      - id: AttackSpeedPerNearbyAllyOrEnemy
        target: 3
    equipment: TeamWarCry
    tags:
      - theme
      - team
  - id: commando-suppressive-fire
    focus: survivor
    title:
      en: Suppressive Fire Spam
      ko: 제압 사격 난사
    tagline:
      en: Stack attack speed so Suppressive Fire fires more and more bullets.
      ko: 공격 속도를 쌓아서 제압 사격 탄환 수를 불리는 코만도 빌드
    summary:
      en: Suppressive Fire shoots more bullets the higher your attack speed, so keep printing Soldier's Syringe and Mocha. Alien Head brings it back sooner, and Sticky Bomb and Ukulele turn every bullet into a proc roll. The skill stuns, so enemies can't do much while you're firing.
      ko: 코만도의 제압 사격은 공격 속도가 오를수록 한 번에 쏘는 탄환 수가 늘어나서, 군인의 주사기와 모카를 흰색 3D 프린터로 계속 늘립니다. 외계인 머리로 제압 사격 쿨타임을 줄이고, 끈끈이 폭탄과 우쿨렐레를 붙이면 탄환 하나하나가 발동 기회가 됩니다. 제압 사격 자체에 충격이 붙어 있어서 쏘는 동안 적이 제대로 움직이지 못합니다.
    whyFun:
      en: One Suppressive Fire dumps dozens of bullets, which is exactly what Commando should feel like.
      ko: 제압 사격 한 번에 총알이 수십 발씩 쏟아져서 코만도 하는 맛이 제대로 납니다.
    survivors:
      - CommandoBody
    items:
      - id: Syringe
        target: 8
      - id: AttackSpeedAndMoveSpeed
        target: 4
      - id: AlienHead
        target: 2
      - id: StickyBomb
        target: 5
      - id: ChainLightning
        target: 2
      - id: CritGlasses
        target: 4
      - id: AttackSpeedOnCrit
        target: 1
    avoid:
      - HalfAttackSpeedHalfCooldowns
    tags:
      - theme
      - solo
  - id: huntress-glaive-bounce
    focus: survivor
    title:
      en: Glaive Bounce
      ko: 글레이브 튕기기
    tagline:
      en: Every Laser Glaive bounce sets off on-hit items.
      ko: 레이저 글레이브가 튕길 때마다 프록이 터지는 헌트리스 빌드
    summary:
      en: Laser Glaive bounces six times and every bounce is a hit, so each on-hit item fires along the chain. Backup Magazine lets you throw several glaives in a row, and Luminous Shot stores charges when you use your secondary and adds lightning to the next primary shots. Sentient Meat Hook pulls enemies together so the glaive has more targets.
      ko: 레이저 글레이브는 적 사이를 여섯 번 튕기면서 매번 적중 판정이 나서, 적중 시 발동하는 아이템을 달수록 튕길 때마다 효과가 같이 터집니다. 보조 탄창으로 글레이브를 연달아 던질 수 있게 하고, 빛나는 사격은 보조 스킬을 쓸 때 충전이 쌓여 이후 기본 공격에 번개를 붙여 줍니다. 지능 있는 고기 갈고리가 있으면 적을 한데 끌어모아 글레이브가 튕길 곳이 많아집니다.
    whyFun:
      en: Throw one glaive and lightning and bombs trail it through the whole pack.
      ko: 글레이브 하나 던지면 적 무리 사이로 번개와 폭탄이 줄줄이 따라붙는 게 보기 좋습니다.
    survivors:
      - HuntressBody
    items:
      - id: SecondarySkillMagazine
        target: 5
        note:
          en: More glaive charges.
          ko: 글레이브를 여러 번 연달아 던집니다.
      - id: IncreasePrimaryDamage
        target: 2
      - id: ChainLightning
        target: 3
      - id: BleedOnHit
        target: 3
      - id: StickyBomb
        target: 3
      - id: BounceNearby
        target: 1
      - id: AlienHead
        target: 1
    avoid:
      - ChainLightningVoid
    tags:
      - theme
      - solo
  - id: bandit-lights-out
    focus: survivor
    title:
      en: Lights Out Chain
      ko: 소등 연쇄
    tagline:
      en: Kill with Lights Out, reset every cooldown, repeat.
      ko: 소등으로 처치할 때마다 쿨타임을 초기화하며 한 발씩 끝내는 도적 빌드
    summary:
      en: Lights Out resets all your cooldowns on a kill, so the whole build is about making one shot enough. Crowbar adds damage to healthy targets and Old Guillotine finishes low-health elites, which both raise the chance a Lights Out kills. Smoke Bomb, get behind the target for a guaranteed backstab crit, Lights Out, and repeat.
      ko: 소등은 적을 처치하면 모든 쿨타임이 초기화되니 한 발로 끝낼 수 있게 피해를 키우는 게 핵심입니다. 쇠지렛대는 체력이 많은 적에게 추가 피해를 주고 낡은 단두대는 체력이 낮은 엘리트를 바로 처치해서, 둘 다 소등으로 끝낼 확률을 올려 줍니다. 연막탄으로 숨은 뒤 뒤로 돌아가면 뒤치기로 치명타가 확정이라 연막탄, 소등, 연막탄 순서를 반복합니다.
    whyFun:
      en: Every kill brings Lights Out straight back, so you shoot down enemies one after another.
      ko: 적이 쓰러질 때마다 소등이 바로 돌아와서 한 명씩 차례로 쏴 넘기는 재미가 있습니다.
    survivors:
      - Bandit2Body
    items:
      - id: Crowbar
        target: 5
        note:
          en: Bonus damage to enemies above 90% health.
          ko: 체력이 많은 적에게 추가 피해를 줍니다.
      - id: BossDamageBonus
        target: 4
      - id: IncreaseDamageOnMultiKill
        target: 5
      - id: CritGlasses
        target: 3
      - id: ExecuteLowHealthElite
        target: 2
      - id: KillEliteFrenzy
        target: 1
      - id: AlienHead
        target: 1
    equipment: CritOnUse
    tags:
      - theme
      - solo
  - id: mult-power-mode
    focus: survivor
    title:
      en: Power Mode Turret
      ko: 파워 모드 포대
    tagline:
      en: MUL-T plants himself in Power Mode and fires both primaries at once.
      ko: 파워 모드로 멈춰 서서 두 무기를 동시에 쏘는 MUL-T 빌드
    summary:
      en: Power Mode fires both primaries at once and adds 100 armor but cuts movement speed by 60%, so build to hold a spot. Bustling Fungus heals while you stand still, which fits best, backed by Repulsion Armor Plate and Tougher Times. Pair a fast weapon like the Auto-Nailgun with a heavy one like the Rebar Puncher.
      ko: 파워 모드는 주요 공격 두 개를 동시에 쓰고 방어력 100을 얻는 대신 이동 속도가 60% 줄어서, 아예 자리를 잡고 버티는 쪽으로 아이템을 맞춥니다. 뿜뿜 버섯은 멈춰 있을 때 주변을 회복시키니 가장 잘 맞고, 반발성 방어구 철판과 힘들었던 시절로 버팁니다. 무기는 자동 네일건처럼 연사가 빠른 쪽과 철근 펀처처럼 한 방이 센 쪽을 섞으면 좋습니다.
    whyFun:
      en: Standing your ground like a tank while pouring nails and rebar at once feels heavy in a good way.
