  - id: equipment-spam
    focus: equipment
    title:
      en: Equipment Spam
      ko: 장비 난사
    tagline:
      en: "Gesture of the Drowned, Fuel Cells and Bottled Chaos: equipment fires on every cooldown."
      ko: 익사자들의 손짓으로 장비를 쿨마다 자동으로 쓰는 난장판 조합
    summary:
      en: Get Gesture of the Drowned from a Lunar Pod or the Bazaar; every Fuel Cell cuts the cooldown further. Bottled Chaos adds random equipment effects on each use and War Horn gives attack speed each time. Hold a big one-shot equipment like Preon Accumulator and just remember it fires on its own.
      ko: 익사자들의 손짓은 루나 포드나 시간 사이의 시장에서 구하고, 연료 전지를 쌓을수록 장비 쿨타임이 줄어 발동 횟수가 늘어납니다. 병 속의 혼돈은 장비를 쓸 때마다 무작위 장비 효과를 하나 더 터뜨리고, 전투의 뿔피리는 장비를 쓸 때마다 공격 속도를 올려 줍니다. 장비는 프레온 축전기처럼 한 번에 크게 터지는 걸 쥐고, 쿨마다 멋대로 발사된다는 점만 조심합니다.
    whyFun:
      en: You never pick what to use; equipment keeps going off, random effects included.
      ko: 뭘 쓸지 고를 필요 없이 장비가 계속 터지고 가끔 엉뚱한 효과까지 섞여서 매번 난리가 납니다.
    survivors:
      - ToolbotBody
    items:
      - id: AutoCastEquipment
        target: 2
      - id: EquipmentMagazine
        target: 6
      - id: RandomEquipmentTrigger
        target: 3
        note:
          en: Each use also fires a random equipment effect.
          ko: 장비를 쓸 때마다 무작위 장비 효과가 추가로 터집니다.
      - id: EnergizedOnEquipmentUse
        target: 3
      - id: BoostAllStats
        target: 1
    equipment: BFG
    avoid:
      - EquipmentMagazineVoid
    tags:
      - chaos
      - theme
      - team
  - id: blast-shower-bands
    focus: equipment
    title:
      en: Blast Shower Band Reset
      ko: 폭발 세례 반지 초기화
    tagline:
      en: Use Blast Shower to wipe the Band cooldown so Runald's and Kjaro's fire back to back.
      ko: 폭발 세례로 반지 쿨타임을 계속 지워서 반지를 연달아 터뜨리는 조합
    summary:
      en: Kjaro's and Runald's Band trigger on hits of 400%+ damage and then go on a 10-second cooldown that counts as a debuff, so Blast Shower clears it instantly. Make Blast Shower auto-cast with Gesture of the Drowned, then cut its cooldown with Fuel Cells and Soulbound Catalyst. Survivors with one big hit, like Railgunner or Loader, fit best.
      ko: 캬로의 반지와 루널드의 반지는 400% 이상 피해를 한 방에 주면 발동하고 10초 쿨타임이 생기는데, 이 쿨타임이 디버프처럼 붙어 있어서 폭발 세례를 쓰면 바로 지워집니다. 익사자들의 손짓으로 폭발 세례를 자동 발동하게 만든 뒤 연료 전지와 영혼이 속박된 촉매로 장비 쿨타임을 줄일수록 반지가 자주 터집니다. 한 방이 센 레일거너나 로더가 가장 잘 맞습니다.
    whyFun:
      en: The Band effects go off almost without a cooldown and boss health drops noticeably faster.
      ko: 반지 이펙트가 거의 쿨 없이 계속 터져서 보스 체력이 눈에 띄게 빨리 깎입니다.
    survivors:
      - RailgunnerBody
      - LoaderBody
      - MageBody
    items:
      - id: FireRing
        target: 2
      - id: IceRing
        target: 2
      - id: AutoCastEquipment
        target: 1
      - id: EquipmentMagazine
        target: 5
      - id: Talisman
        target: 1
        note:
          en: Kills shorten equipment cooldown.
          ko: 처치할 때마다 장비 쿨타임이 줄어듭니다.
      - id: StrengthenBurn
        target: 2
    equipment: Cleanse
    avoid:
      - ElementalRingVoid
    tags:
      - theme
      - solo
  - id: crowdfunder-gold
    focus: equipment
    title:
      en: Money Cannon
      ko: 황금포 돈 폭격
    tagline:
      en: Gold-making items feeding The Crowdfunder and War Bonds.
      ko: 골드 버는 아이템을 모아서 황금포와 전쟁 채권으로 돈을 쏘는 조합
    summary:
      en: Brittle Crown pays gold on hit but costs gold when you're hit, so Roll of Pennies and Tougher Times keep the losses down. The Crowdfunder spends gold to fire, so unload it on bosses when you're rich; War Bonds adds missiles for gold earned before the boss event, which suits Ghor's Tome. The house rule is to spend spare gold as ammo, not on chests.
      ko: 연약한 왕관은 때릴 때 골드를 주지만 맞으면 골드를 잃으니 동전 말이와 힘들었던 시절로 손실을 줄여 둡니다. 황금포는 골드를 소모해서 쏘는 장비라 골드가 넉넉할 때 보스에게 쏟아붓고, 전쟁 채권은 보스 이벤트 전에 번 골드만큼 미사일이 늘어나서 고르의 서와 잘 맞습니다. 남는 골드는 상자 대신 총알로 쓰는 게 이 빌드의 규칙입니다.
    whyFun:
      en: Watching the gold counter swing while you literally shoot your money is weirdly satisfying.
      ko: 골드 숫자가 오르내리는 걸 보면서 번 돈을 그대로 총알로 쓰는 게 묘하게 재밌습니다.
    items:
      - id: GoldOnHit
        target: 1
        note:
          en: Gold on hit, but you lose gold when hit.
          ko: 때리면 골드를 얻고 맞으면 잃습니다.
      - id: GoldOnHurt
        target: 5
      - id: BonusGoldPackOnKill
        target: 4
      - id: BarrageOnBoss
        target: 1
      - id: Bear
        target: 4
        note:
          en: Blocked hits don't cost Brittle Crown gold.
          ko: 막아 낸 공격은 왕관 골드를 뺏지 않습니다.
    equipment: GoldGat
    avoid:
      - LunarBadLuck
    tags:
      - theme
      - chaos
  - id: recycler-gamble
    focus: equipment
    title:
      en: Recycler Gambling
      ko: 재활용기 도박
    tagline:
      en: Reroll every drop with the Recycler and pile on luck and extra-chest items.
      ko: 재활용기로 아이템을 계속 돌려서 원하는 걸 뽑아 가는 도박 빌드
    summary:
      en: The Recycler turns a dropped item into another item of the same tier, so reroll anything you don't like before picking it up. Chance Doll pushes Shrines of Chance toward higher tiers, while Sale Star, Shipping Request Form and Rusted Key add more chests to open. Ultimate Meal from the Wandering CHEF adds luck at full health.
      ko: 재활용기는 바닥에 떨어진 아이템을 같은 등급의 다른 아이템으로 바꾸니, 상자를 열 때마다 마음에 안 들면 돌리고 줍는 식으로 진행합니다. 확률의 인형으로 확률의 성소에서 한 단계 높은 등급을 노리고, 할인의 별, 배송 요청 양식, 녹슨 열쇠로 챙기는 아이템 수 자체를 늘립니다. 궁극의 요리는 떠돌이 셰프에게서 만들 수 있고 체력이 가득 찼을 때 운이 올라갑니다.
    whyFun:
      en: Rolling until the red item you want shows up makes every chest feel like a gacha pull.
      ko: 원하는 빨간 아이템이 나올 때까지 돌리다 보면 상자 하나하나가 뽑기처럼 느껴집니다.
    items:
      - id: ExtraShrineItem
        target: 3
      - id: LowerPricedChests
        target: 2
      - id: FreeChest
        target: 2
      - id: TreasureCache
        target: 2
      - id: SpeedOnPickup
        target: 2
      - id: UltimateMeal
        target: 1
        note:
          en: Cooked by the Wandering CHEF; luck at full health.
          ko: 떠돌이 셰프에게서 만들고, 체력이 가득 찼을 때 운이 오릅니다.
      - id: Clover
        target: 1
    equipment: Recycle
    avoid:
      - LunarBadLuck
    tags:
      - theme
      - chaos
      - team
  - id: drone-army
    focus: survivor
    title:
      en: Drone Squadron
      ko: 드론 부대
    tagline:
      en: Operator stacks every drone item and leads a whole squadron.
      ko: 드론 아이템을 몰아 받아 드론 부대를 이끄는 오퍼레이터 빌드
    summary:
      en: Operator fights alongside his own drones, so drone items are worth the most on him; repair every drone you find on each stage as well. Spare Drone Parts gives every drone a chain gun and Box of Dynamite has them drop dynamite. Bolstering Lantern scales with nearby allies and Faulty Conductor buffs allies around you, so both grow with the squad.
      ko: 오퍼레이터는 자기 드론을 데리고 싸우는 생존자라 드론 강화 아이템의 효율이 가장 좋고, 스테이지마다 보이는 드론도 전부 고쳐서 수를 늘립니다. 드론 예비 부품은 드론마다 체인 건을 달아 주고, 다이너마이트 상자는 드론이 다이너마이트를 떨구게 합니다. 강화의 등불은 근처 아군 수만큼 공격 속도를 올려 주고 결함 있는 전도체는 주위 아군까지 강화하니 부대가 커질수록 이득입니다.
    whyFun:
      en: With ten-plus drones in tow the screen is full of gunfire even when you aren't shooting.
      ko: 드론 열 대 넘게 끌고 다니면 내가 안 쏴도 화면이 총소리로 가득합니다.
    survivors:
      - DroneTechBody
    items:
      - id: DroneWeapons
        target: 2
        note:
          en: Chain gun on every drone.
          ko: 모든 드론에 체인 건이 붙습니다.
      - id: DronesDropDynamite
        target: 3
      - id: AttackSpeedPerNearbyAllyOrEnemy
        target: 3
      - id: ShockDamageAura
        target: 1
      - id: WardOnLevel
        target: 2
      - id: RoboBallBuddy
        target: 1
    equipment: DroneBackup
    tags:
      - theme
      - long-run
      - solo
  - id: rex-self-damage
    focus: survivor
    title:
      en: REX Blood Price
      ko: 렉스 자해 빌드
    tagline:
      en: REX spends his own health to set off Genesis Loop and Razorwire on purpose.
      ko: 체력을 일부러 깎아서 태초 고리와 철조망을 터뜨리는 렉스 전용 조합
    summary:
      en: REX's Seed Barrage costs health, so he can push himself under Genesis Loop's 25% threshold at will. Razorwire lashes out whenever enemies hit you, and Mired Urn plus Leeching Seed fill the health back up. Corpsebloom spreads healing out over time, which makes it easier to hang around low health.
      ko: 렉스의 씨앗 세례는 체력을 깎아서 쏘는 스킬이라, 태초 고리가 발동하는 체력 25% 미만 조건을 스스로 만들 수 있습니다. 철조망은 적에게 맞을 때마다 주변을 긁어 주고, 진흙 항아리와 흡혈 씨앗으로 깎인 체력을 다시 채웁니다. 시체꽃은 회복을 천천히 나눠 받게 만들어서 체력이 낮은 구간을 오래 유지하기 좋습니다.
    whyFun:
      en: Riding the edge of your health bar and setting off explosions on purpose feels great.
      ko: 체력바를 아슬아슬하게 유지하면서 폭발을 일부러 터뜨리는 게 손맛이 좋습니다.
    survivors:
      - TreebotBody
    items:
      - id: NovaOnLowHealth
        target: 3
        note:
          en: Explodes when you drop below 25% health.
          ko: 체력이 25% 아래로 떨어지면 터집니다.
      - id: Thorns
        target: 3
      - id: RepeatHeal
        target: 1
      - id: IncreaseHealing
        target: 2
      - id: Seed
        target: 3
      - id: SiphonOnLowHealth
        target: 1
      - id: Medkit
        target: 3
    equipment: LifestealOnHit
    tags:
      - theme
      - solo
  - id: acrid-cooldown
    focus: survivor
    title:
      en: Acrid Cooldown Spam
      ko: 애크리드 쿨타임 난사
    tagline:
      en: Purity and Light Flux Pauldron on Acrid so Epidemic almost never stops.
      ko: 순수와 빛의 흐름 견갑으로 쿨타임을 줄여 유행병을 계속 뿌리는 애크리드 빌드
    summary:
      en: Acrid's poison deals a share of max health and doesn't depend on proc chance, so Purity's luck penalty hardly costs anything. Light Flux Pauldron halves attack speed but also halves cooldowns, so Neurotoxin and Epidemic come back much faster; Alien Head and Backup Magazine cut them further. Open every Lunar Pod you see.
      ko: 애크리드의 독은 적 최대 체력 비율로 들어가고 확률 아이템에 기대지 않으니, 순수의 행운 감소가 거의 손해가 되지 않습니다. 빛의 흐름 견갑은 공격 속도를 절반으로 줄이는 대신 쿨타임도 절반으로 줄여 신경독과 유행병을 훨씬 자주 쓸 수 있고, 외계인 머리와 보조 탄창으로 더 줄입니다. 루나 포드가 보이면 일단 열어 보는 게 이 빌드의 시작입니다.
    whyFun:
      en: Epidemic bounces around the room almost nonstop and poison spreads to everything.
      ko: 유행병이 거의 쉬지 않고 방 안을 튀어 다니면서 적 전체에 독이 퍼지는 게 재밌습니다.
    survivors:
      - CrocoBody
    items:
      - id: LunarBadLuck
        target: 3
        note:
          en: Poison doesn't rely on luck, so the downside barely matters.
          ko: 독은 확률에 기대지 않아서 단점이 거의 안 느껴집니다.
      - id: HalfAttackSpeedHalfCooldowns
        target: 1
      - id: AlienHead
        target: 2
      - id: SecondarySkillMagazine
        target: 5
      - id: UtilitySkillMagazine
        target: 1
      - id: Bandolier
        target: 2
    avoid:
      - Clover
    tags:
      - theme
      - solo
  - id: glass-cannon
    focus: items
    title:
      en: Glass Cannon
      ko: 유리 대포
    tagline:
      en: "Stack Shaped Glass: you one-shot everything and everything one-shots you."
      ko: 모양이 있는 유리를 쌓아서 한 대 치면 죽이고 한 대 맞으면 죽는 빌드
    summary:
      en: Each Shaped Glass doubles base damage and halves max health, so three means 8x damage on 1/8 health. Delicate Watch breaks when you drop below 25% health, so treat it as good until the first real hit, and use Crowbar and Focus Crystal to make the opening shot as big as possible. Kill things before they reach you, so long-range survivors are easiest.
      ko: 모양이 있는 유리는 하나당 기본 피해를 두 배로 늘리고 최대 체력을 절반으로 줄여서, 세 개면 피해 8배에 체력은 8분의 1이 됩니다. 섬세한 시계는 체력이 25% 아래로 떨어지면 깨지니 사실상 한 번 크게 맞을 때까지만 쓰는 아이템이고, 쇠지렛대와 초점 크리스털로 첫 타를 최대한 키웁니다. 적이 다가오기 전에 멀리서 끝내야 하니 사거리가 긴 생존자가 편합니다.
    whyFun:
      en: Bosses melt in a few shots, but a single graze kills you, so every fight is tense.
      ko: 보스를 몇 발 만에 녹이는 대신 스치기만 해도 죽어서 전투마다 긴장됩니다.
    survivors:
      - RailgunnerBody
      - Bandit2Body
      - MageBody
    items:
      - id: LunarDagger
        target: 3
        note:
