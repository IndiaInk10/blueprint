  - id: void-only
    focus: items
    title:
      en: Void-Only Run
      ko: 공허 아이템 런
    tagline:
      en: Fill your inventory with void items only, from Void Cradles and Void Potentials.
      ko: 공허 요람과 잠재 공허만 열어서 보라색 아이템으로 채우는 도전
    summary:
      en: Void items corrupt their normal counterparts, so treat normal items as filler until you find Void Cradles. Needletick's Collapse, Polylute and Plasma Shrimp carry the damage, and Benthic Bloom upgrades items every stage. Playing Void Fiend matches the corruption theme nicely.
      ko: 공허 아이템은 짝이 되는 일반 아이템을 오염시키니, 일반 아이템은 공허 요람을 만나기 전까지 버티는 용도로만 씁니다. 니들틱의 붕괴와 폴리류트, 플라즈마 새우가 주력 딜을 맡고, 물속의 꽃이 스테이지마다 아이템을 한 단계씩 올려 줍니다. 공허 악마로 하면 오염 게이지와 테마가 맞아서 분위기가 삽니다.
    whyFun:
      en: An all-purple inventory looks completely different and feels oddly satisfying.
      ko: 보라색 아이템만 모아 놓으면 인벤토리부터 분위기가 달라서 괜히 뿌듯합니다.
    survivors:
      - VoidSurvivorBody
    items:
      - id: BleedOnHitVoid
        target: 5
        note:
          en: Collapse is the main damage.
          ko: 붕괴가 주력 딜입니다.
      - id: ChainLightningVoid
        target: 3
      - id: MissileVoid
        target: 3
      - id: CloverVoid
        target: 2
