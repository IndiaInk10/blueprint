  - id: heretic-transcendence
    focus: survivor
    title:
      en: Transcendent Heretic
      ko: 이단자 초월
    tagline:
      en: Transcendence removes the Heretic's health-drain worries and lets shields carry you.
      ko: 초월로 체력이 새는 부담을 덜고 방어막으로 버티는 이단자 빌드
    summary:
      en: Heretic has strong skills but constantly loses health; Transcendence turns health into shield and raises the maximum by 50%, which makes Heretic far easier to play. Shields refill after a short break from damage, so dart out with Strides of Heresy and come back, and grow the shield with Personal Shield Generators and Bison Steaks. Alien Head lets you cycle the Heresy skills more often.
      ko: 이단자는 체력이 계속 줄어드는 대신 스킬이 강한 생존자인데, 초월을 먹으면 체력이 방어막으로 바뀌고 최대치도 50% 늘어나서 훨씬 편해집니다. 방어막은 잠깐만 안 맞으면 다시 차니 이단의 발걸음으로 빠졌다가 다시 들어가는 식으로 싸우고, 개인용 방어막 생성기와 들소 스테이크로 방어막 양을 늘립니다. 외계인 머리로 쿨타임을 줄이면 이단 스킬을 더 자주 돌릴 수 있습니다.
    whyFun:
      en: A character who normally bleeds health can finally stay in fights and use those skills freely.
      ko: 원래 체력이 줄줄 새는 캐릭터인데 방어막 덕에 오래 버티면서 이단 스킬을 마음껏 쓸 수 있습니다.
