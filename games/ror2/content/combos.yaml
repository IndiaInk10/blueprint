  - id: lunar-only
    focus: items
    title:
      en: Lunar-Only Run
      ko: 루나 아이템 전용 런
    tagline:
      en: Skip normal items entirely and finish the run on lunar items alone.
      ko: 흰색·녹색·빨간색 아이템은 안 줍고 루나 아이템만으로 끝까지 가는 도전
    summary:
      en: "Rules: never pick up normal items from chests; only use lunar items from Lunar Pods and the Bazaar. Grab Eulogy Zero first so some chest and printer drops turn lunar, and holding all four Heresy items turns you into the Heretic. Lunar Coins are tight, so save them in the first few stages."
      ko: 상자에서 나온 일반 아이템은 줍지 않고, 루나 포드와 시간 사이의 시장에서 얻은 루나 아이템만 쓰는 게 규칙입니다. 0의 찬미가를 먼저 구하면 상자와 3D 프린터에서 나오는 아이템 일부가 루나로 바뀌어 고를 게 많아지고, 이단 아이템 네 개를 다 모으면 이단자로 변신합니다. 루나 코인이 늘 모자라니 초반 몇 스테이지는 코인을 아껴 둡니다.
    whyFun:
      en: Every item has a downside, so each pickup is a real decision.
      ko: 아이템마다 단점이 붙어 있어서 뭘 먹을지 매번 고민하게 됩니다.
    items:
      - id: RandomlyLunar
        target: 3
        note:
          en: Turns some chest and printer drops into lunar items.
          ko: 상자·프린터에서 나오는 아이템 일부를 루나로 바꿉니다.
      - id: LunarSun
        target: 1
      - id: LunarDagger
