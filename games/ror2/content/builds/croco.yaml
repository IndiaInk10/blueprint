              min: 1
            stacksReason:
              en: a Steam discussion says load up for Blight on bosses; +1 bite charge each (wiki), so 5 is a solid goal.
              ko: 스팀 토론은 보스에게 역병을 쌓으려면 많이 챙기라고 합니다. 개당 물기 충전 +1(위키)이라 5개를 목표로 합니다.
          - id: BleedOnHit
            priority: core
            note:
              en: Bleed adds a second stacking DoT and another debuff.
              ko: 출혈로 중첩되는 지속 피해와 디버프가 하나 더 붙습니다.
            stacks:
