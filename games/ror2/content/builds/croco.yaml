        reason:
          en: DoT ticks do not heal, so on-hit healing is minimal.
          ko: 지속 피해로는 회복되지 않아 적중 시 회복량이 미미합니다.
    evidence: |-
      Blight + Ravenous Bite + Frenzied Leap loadout: Rogue Ranker. Blight's non-refreshing duration and the Purity / Alien Head / Lysate Cell cooldown picks: wiki.gg Acrid strategy. 'Load up on backup mags to stack blights on bosses': Steam discussion summary. Noxious Thorn transferring Blight/Poison: wiki.gg Noxious Thorn (Seekers of the Storm item). Death Mark with Acrid debuffs: wiki.gg and Rogue Ranker. Needletick: 2022 Steam Ultimate Acrid Guide; Shatterspleen: 2021 Steam thread. Disagreement: wiki.gg and a 2024 Steam thread favor Poison for most runs, especially loops; Blight is judged viable but weaker against flyers. Community Blight item lists are thinner than Poison ones.

      Stack counts and progression: Thinner than the Poison build. Stack values from wiki.gg item data: Tri-Tip +10%/stack reaching 100% at 10 on proc-coefficient 1.0 hits (wiki Tri-Tip page), Alien Head 0.75^n with a 0.5 s floor and Purity applied after it (wiki Alien Head/Purity), Death Mark +7 s per stack, Scorpion armor-damage asymptote. Skill cooldowns (Bite 2 s, Frenzied Leap 10 s, Epidemic 10 s) and Blight's non-refreshing 5 s duration: wiki Acrid. 'Load up on backup mags for Blight': Steam discussion summary already cited in the build. Hardlight: Deltia's; Clover: Rogue Ranker; Safer Spaces and Lysate Cell: GameRant. Needletick corrupting Tri-Tip: wiki item data. Disagreement: wiki.gg and a Steam thread say Poison, not Blight, is the better pick for loops, so this build's loop advice is modest. No boss pick order: no Blight source ranks boss items. Steam guide pages returned HTTP 429; Reddit was not tried.
