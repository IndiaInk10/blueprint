    evidence: |-
      Corruption rules, Backup Magazine refill, crit items, Flood triggering Bands, Topaz Brooch, and the Corpsebloom / Cautious Slug / Weeping Fungus warnings: wiki.gg Void Fiend (strong). Syringe (attack speed scales Corrupted Drown, patch 1.2.2.0), Predatory Instincts, Rejuvenation Rack: Rogue Ranker. Pocket ICBM, Scorpion, Plasma Shrimp, Polylute, Transcendence, Topaz, Tougher Times: Steam item guide 2775783244 (March 2022). Defensive picks, void items raising minimum corruption, and Lost Seer's Lenses to avoid: GameRant (Aug 2022). Disagreements: Rogue Ranker says avoid Crowbar, Focus Crystal and Delicate Watch because of Suppress self-damage, while the 2022 Steam guide rates Focus Crystal 'extremely useful' and patch 1.2.2.0 says Corrupted Suppress no longer procs items on yourself. Crowbar/Watch stay in the avoid list with a patch flag; Focus Crystal is left out. The Steam guide says 'avoid all Heresy items', while wiki.gg says Essence of Heresy builds Ruin quickly with Corrupted Drown, and patch 1.2.3 lets Heresy override both skill versions; left out of the tree. Source quality: mixed. Most dedicated item guides are from 2022; no 2024+ patch changed Void Fiend's corruption beyond a Trespass overheat bug fix in Seekers of the Storm.

      Stack counts and progression: Corruption rules (3%/s build, 6.67%/s decay, crits 2% per proc coefficient, 2% minimum per void item, can reach 100% and lock you in, healing drains 1% per 1% max HP): wiki.gg Void Fiend. 'Stack at least 10-20' of Topaz/Tougher Times/Armor Plate, '20 Tougher Times = 75%', '10 glasses = 100%', 'one or two Harvester's Scythes are acceptable', Hardlight late, avoid Weeping Fungus and Lost Seer's Lenses: GameRant (2022). Tougher Times hyperbolic table and Lens-Maker's effective limit of 10: wiki item pages. '13 void items -> 26% minimum, Suppress heals indefinitely': Rogue Ranker only, not verified in-game. The 50-void-item milestone is my calculation from the wiki's 2% per item. Laser Scope in the loop node follows from the wiki's 100% crit limit; no Void Fiend source names it. Disagreement: a separate search summary quoted '14 void items for permanent corruption', which contradicts the wiki's 2% per item, so it is not used. Steam item guide 2775783244 returned HTTP 429 and could not be re-read. No boss pick order: sources do not rank boss items for Void Fiend.
