              ko: 순수와 잘 맞습니다. 외계인 머리가 먼저 적용되고 순수의 고정 감소가 뒤에 붙습니다.
            stacksReason:
              en: "Rogue Ranker calls 1-2 Alien Heads the efficient range; wiki: two stacks cut cooldowns by 43.8%."
              ko: Rogue Ranker는 외계인 머리 1~2개를 효율 구간으로 봅니다. 위키 기준 2개면 쿨타임이 43.8% 줄어듭니다.
          - id: LunarDagger
            priority: situational
            stacks:
              target: 2
              min: 1
            note:
              en: Players stack it with Crowbars for one-shots; halves max HP per stack, so only with Smoke Bomb uptime.
              ko: 쇠지렛대와 함께 한 방을 노리는 유저들이 씁니다. 개당 최대 체력이 절반이 되므로 연막탄 유지율이 높을 때만 쓰세요.
            stacksReason:
              en: players stack it with Crowbars; 2 triples base damage (wiki) but cuts max HP hard, so only with Smoke Bomb uptime.
              ko: 플레이어들이 쇠지렛대와 함께 쌓습니다. 위키 기준 2개면 기본 피해가 3배지만 최대 체력이 크게 줄어, 연막탄 유지가 될 때만 쓰세요.
