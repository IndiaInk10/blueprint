    evidence: |-
      Mixed/thin. Desperado + Purity: wiki (early stacking, gives up luck-based effects) and Steam 'Item Builds' guide (2022: 4 Purity + Crowbar, 'Targeted' variant with Old Guillotine). Crowbar scaling with Desperado and 'best for long games': Steam discussions (2021). Bandolier to replace the missing reset: wiki. Sources disagree on Lights Out vs Desperado; Lights Out is the more common recommendation.

      Stack counts and progression: Wiki Desperado page: tokens give +10% damage each and are lost when advancing a stage, so the build's 'permanent damage' summary is inaccurate across stages. Purity counts: Steam 'Lights Out or Desperado?' (2021, '2 purity'), Steam late-game thread (2021, '2 purity, 1 alien head, crowbar'), and the Steam 'Item Builds' guide (4 Purity, from the existing build evidence; could not refetch, HTTP 429). Brainstalks: Steam thread ('straight upgrade'), search summaries of Bandit threads ('150-200 kills' token strategy; not verified on the page). Alien Head + Purity: TheGamer (May 2024) and Rogue Ranker Alien Head page (order of application). Shaped Glass: Steam thread original post only. Bandolier table: wiki. Sources are mostly 2021, so the loop advice is thin and old; no Desperado changes found since.
