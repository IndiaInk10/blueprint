              ko: Steam 'Item Builds' 공략은 순수를 4개 정도 씁니다. 쿨타임은 0.5초 아래로 내려가지 않아 그 이상은 행운만 깎습니다.
          - id: Bandolier
            priority: core
            note:
              en: Makes up for Desperado having no reset on kill.
              ko: 처치 시 초기화가 없는 데스페라도를 보완합니다.
            stacks:
