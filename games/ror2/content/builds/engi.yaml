kind: survivor-builds
schemaVersion: 1
revision: 5
updatedAt: 2026-09-26
survivor: EngiBody
gameVersion: v1.4.1 (Alloyed Collective)
sourceQuality: strong
sources:
  - https://riskofrain2.wiki.gg/wiki/Engineer
  - https://riskofrain2.wiki.gg/wiki/Bustling_Fungus
  - https://riskofrain2.wiki.gg/wiki/Lysate_Cell
