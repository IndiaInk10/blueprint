    evidence: |-
      Only Game Rant (May 2025) gives a Palm Blast item list (Crowbar, Gasoline, Will-o'-the-Wisp, Lysate Cell, Light Flux Pauldron, plus all Soul Spiral items); Item Level and Rogue Ranker mention Palm Blast only as an aggressive option. Thin, single-source tree. Note: Game Rant's page mislabels Sojourn as a primary skill.

      Stack counts and progression: Single-source build: only Game Rant (May 2025) lists Palm Blast items (Crowbar, Gasoline, Will-o'-the-Wisp, Lysate Cell, Light Flux Pauldron, plus all Soul Spiral items). Stack limits are wiki math (Crowbar linear; Lysate Cell +1 charge per stack; Light Flux Pauldron cooldown x0.5 per stack but attack speed divided by 1+n). No source covers loops for Palm Blast, so there is no loop node; follow the Soul Spiral build's loop advice if you switch back. Pick order only lists tiers with three source-backed items; band items come from Game Rant's shared Seeker core.
