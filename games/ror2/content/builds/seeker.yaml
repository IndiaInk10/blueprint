      ko: 명상 대신 폭발 장법을 씁니다. 충전해서 관통하는 손바닥으로 적을 공격하고 아군을 치유합니다. 영혼의 나선 빌드 아이템 위에 처치 효과와 특수 스킬 충전 아이템을 더합니다.
