gameVersion: v1.4.1 (Alloyed Collective)
sourceQuality: mixed
sources:
  - https://riskofrain2.wiki.gg/wiki/Seeker
  - https://riskofrain2.wiki.gg/wiki/Update_Notes_V1.3.8
