    evidence: |-
      Vortex Gaming 600208 gives the 'minmax' loadout (Junk Cube/Repossess/Tinker) and Collector's Compulsion, Lysate Cell, Shuriken (anti-air). Vortex 604560 prefers Tinker for dealing with fliers but pairs it with Cleanup rather than Junk Cube, and recommends Collector's Compulsion and Luminous Shot, saying Substandard Duplicator only fits Salvage. Backup Magazine for Junk Cube charges: Deltia's. Thin: two articles from one outlet, no community threads found.

      Stack counts and progression: Thin: Vortex Gaming (two undated post-DLC articles) is the only build source (Collector's Compulsion, Luminous Shot, Shuriken, Lysate Cell); Deltia's adds Backup Magazine. Tinker mechanics (scrap + temporary copy, two copies from printer items, scrap buffs, luck and Junk) and item stack values are from the Drifter wiki and item data. No source ranks white or red items for this variant, so only an uncommon pick order is given. The loop node is inferred from the same sources' items plus the wiki luck note; no guide discusses Tinker in loops.
