    evidence: |-
      Single source for the loadout: Rogue Ranker (undated, post-DLC) recommends CMD-SWARM and Amp Core once unlocked, plus Spare Drone Parts, Soldier's Syringe, Crowbar, Ukulele, AtG Missile, Paul's Goat Hoof, Predatory Instincts, Harvester's Scythe. Crowbar/Amp Core scaling: wiki. Game Rant and Deltia's instead recommend the default kit, so sources disagree on skills. PATCH-SENSITIVE: V1.4.1 prevents item procs on Amp Core damage. Laser Scope in the late node is borrowed from Game Rant's general Operator list, not from a CMD-SWARM-specific source.

      Stack counts and progression: Thin, single-source loadout (Rogue Ranker, undated post-DLC). CMD-SWARM crits igniting, Amp Core scaling with Crowbar: Operator wiki. V1.4.1 'no item procs on Amp Core damage': patch notes cited in the build file. Glasses cap (10, or 9 with Predatory/Harvester): wiki. Pick order follows Rogue Ranker's order (Syringe, Ukulele, AtG, Predatory; Crowbar, Hoof, Harvester), Crowbar first because every source names it. Pushing crit to 100% in loops is an inference from the wiki crit-ignite mechanic plus Rogue Ranker's crit items, not a guide's explicit advice. No legendary or boss order: only Spare Drone Parts and Laser Scope are backed.
