              ko: 캬로의 반지와 같은 타격으로 발동해 3개면 750% 피해에 9초 둔화입니다.
          - id: EquipmentMagazine
            priority: situational
            note:
              en: With Retool you carry two equipment pieces, and Fuel Cell adds a charge to both.
              ko: 장비 교체로 장비 두 개를 들 때 연료 전지는 두 장비 모두에 충전을 추가합니다.
            stacks:
