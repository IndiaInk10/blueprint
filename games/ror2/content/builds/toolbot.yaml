    pickOrder:
      common:
        - Crowbar
        - SecondarySkillMagazine
        - Hoof
      uncommon:
        - FireRing
        - IceRing
        - EquipmentMagazine
      legendary:
        - Behemoth
        - UtilitySkillMagazine
        - Clover
    milestones:
      - when:
          en: Once you have one of each band
          ko: 반지를 한 종류씩 갖추면
        advice:
          en: "Take both bands before stacking either one: the first copy of each adds a whole new proc, while a second copy only adds damage to a proc you already have. Do not take Singularity Band from a Void cradle or Void Potential: it corrupts every Kjaro's and Runald's Band you hold."
          ko: 한쪽 반지를 중첩하기 전에 두 반지를 먼저 모두 챙기세요. 각 반지의 첫 개는 발동을 하나 새로 추가하지만, 두 번째 개는 이미 있는 발동의 피해만 올립니다. 공허 요람이나 잠재 공허에서 특이점 반지를 고르지 마세요. 가진 캬로의 반지와 루널드의 반지를 전부 오염시킵니다.
        take: []
        stop:
          - ElementalRingVoid
      - when:
          en: If you run offensive drones
          ko: 공격 드론을 쓴다면
        advice:
          en: The wiki warns drones chip enemies below 90% before your Rebar lands, wasting Crowbar. Keep them away from targets or lean less on Crowbar.
          ko: 위키는 드론이 먼저 적 체력을 90% 아래로 깎아 쇠지렛대가 낭비된다고 경고합니다. 드론을 대상에서 떼어 놓거나 쇠지렛대 의존을 줄이세요.
        take: []
        stop: []
      - when:
          en: If your second weapon is Scrap Launcher and you find Purity
          ko: 보조 무기가 고철 발사기이고 순수를 찾았다면
        advice:
          en: One Purity puts Scrap Launcher at its 0.5s floor. The wiki says Purity is better than Alien Head for it; a second Purity adds nothing to Scrap Launcher.
          ko: 순수 1개로 고철 발사기가 0.5초 하한에 닿습니다. 위키는 이 무기에 순수가 외계인 머리보다 낫다고 합니다. 두 번째 순수는 고철 발사기에 도움이 안 됩니다.
        take:
          - LunarBadLuck
          - Behemoth
        stop: []
      - when:
          en: After the first loop
          ko: 첫 루프 이후
        advice:
          en: Keep stacking both bands and Fuel Cells; Crowbar keeps working for Rebar's opening shot.
          ko: 두 반지와 연료 전지를 계속 쌓으세요. 쇠지렛대는 철근의 첫 사격에 계속 효과가 있습니다.
        take:
          - FireRing
          - IceRing
          - EquipmentMagazine
        stop: []
    avoid:
      - id: LunarSpecialReplacement
        reason:
          en: Replaces Retool, so you lose your second weapon and equipment slot.
          ko: 장비 교체를 대체해 두 번째 무기와 장비 칸을 잃습니다.
    evidence: |-
      Wiki: Rebar Puncher and Scrap Launcher have 1.0 proc coefficients, Crowbar + Rebar one-shots Stone Golems, Brilliant Behemoth and Purity for Scrap Launcher, Backup Magazine for Blast Canister. The wiki also warns that offensive drones hit enemies below 90% and waste Crowbar. Steam thread (Nov 2023): Crowbar guarantees band procs with Rebar, double Rebar Retool works because swapping skips reload. TheGamer (2021): Fuel Cell for dual equipment. The loadout lists one primary; set the second primary slot to Auto-Nailgun or Scrap Launcher. Mixed: fewer sources than the Nailgun build.

      Stack counts and progression: Wiki MUL-T page: Crowbar + Rebar one-shots Stone Golems, Backup Magazine for Blast Canister, Behemoth with Scrap Launcher, Purity takes Scrap Launcher to 0.5s and beats Alien Head for it, drone Crowbar warning, Retool swap faster than holding Rebar until 360% attack speed. Band behaviour (fixed 10s, no luck) and Purity luck formula: wiki item pages. Backup Magazine 2-3 and Fuel Cell 4+: TheGamer. Steam thread (Nov 2023): Crowbar guarantees band procs with Rebar; retool 0.5s minimum cooldown limits late scaling. Fewer sources than the Nailgun build; no boss order. Legendary order is weak: Behemoth (wiki, Scrap only), Hardlight and Clover from the build tree.
