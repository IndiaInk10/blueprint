              en: Brings Scrap Launcher's reload down to the 0.5s floor for much more firepower.
              ko: 고철 발사기의 재장전이 최소치인 0.5초까지 줄어 화력이 크게 오릅니다.
            stacks:
              target: 1
              max: 1
            stacksReason:
