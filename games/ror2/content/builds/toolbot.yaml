              ko: 캬로의 반지와 같은 타격으로 발동해 3개면 750% 피해에 9초 둔화입니다.
          - id: LunarBadLuck
            priority: situational
            stacks:
              target: 1
              max: 1
            note:
              en: "Only with Scrap Launcher as the second weapon. Wiki: one Purity brings its cooldown to the 0.5s floor. Bands ignore luck, so the bad-luck side hurts this build less than most."
              ko: 보조 무기가 고철 발사기일 때만 고르세요. 위키 기준 순수 1개로 쿨타임이 0.5초 하한에 닿습니다. 반지는 행운의 영향을 받지 않아 불운 페널티가 다른 빌드보다 덜 아픕니다.
            stacksReason:
              en: one Purity already brings the key cooldown to the 0.5s floor; more only add bad luck.
              ko: 위키 기준 순수 1개로 핵심 스킬 쿨이 이미 0.5초 하한에 닿고, 더 가지면 불운만 늘어납니다.
          - id: Behemoth
            priority: situational
            stacks:
              target: 1
              max: 1
            note:
