builds:
  - id: toolbot-power-mode-nailgun-tank
    title:
      en: Power Mode Nailgun Tank
      ko: 파워 모드 네일건 탱커
    difficulty: beginner
    summary:
      en: Equip Auto-Nailgun in both primary slots and use Power Mode to fire both at once with 100 bonus armor. The nail stream triggers on-hit items constantly (0.6 proc coefficient per nail), and attack speed multiplies all of it.
      ko: 주 무기 두 칸 모두 자동 네일건을 장착하고 파워 모드로 두 정을 동시에 쏘며 방어력 100을 얻습니다. 쏟아지는 못이 적중 효과를 계속 발동시키고(못당 발동 계수 0.6), 공격 속도가 이 모든 것을 배로 늘립니다.
    loadout:
      primary: TOOLBOT_PRIMARY_NAME
      secondary: TOOLBOT_SECONDARY_NAME
      utility: TOOLBOT_UTILITY_NAME
      special: TOOLBOT_SPECIAL_ALT_NAME
    root: core
    nodes:
      - id: core
        phase: early
        label:
          en: Early core
          ko: 초반 핵심
        when:
          en: Stages 1-2. Soldier's Syringe is priority every run.
          ko: 1~2스테이지. 군인의 주사기는 매 판 최우선입니다.
        items:
          - id: Syringe
            priority: core
            note:
              en: Faster nail fire rate means more damage and more on-hit procs from every other item.
              ko: 못 연사가 빨라져 피해와 다른 모든 적중 효과의 발동이 늘어납니다.
            stacks:
              target: 10
              min: 3
            stacksReason:
              en: "3-4 to start, Rogue Ranker: stack aggressively; no cap, so aim for 10."
              ko: TheGamer는 초반 3~4개, Rogue Ranker는 적극적으로 쌓으라고 하며 상한이 없으니 10개를 목표로 하세요.
          - id: Hoof
            priority: core
            note:
              en: Fixes MUL-T's slow movement, especially with Power Mode's movement penalty.
              ko: MUL-T의 느린 이동 속도를 보완하며, 파워 모드의 이동 속도 감소가 있을 때 특히 중요합니다.
            stacks:
              target: 3
              min: 2
            stacksReason:
              en: aim for 2-3 Hoofs to fix MUL-T's slow speed.
              ko: MUL-T의 느린 속도를 보완하려면 염소발 2~3개를 목표로 하세요.
          - id: BleedOnHit
            priority: optional
            note:
              en: Thousands of nails stack bleed fast.
              ko: 쏟아지는 못으로 출혈이 빠르게 쌓입니다.
            stacks:
              target: 10
              min: 1
              max: 10
            stacksReason:
              en: 10% bleed chance per stack, so 10 is a 100% chance and the cap.
              ko: 위키 기준 개당 출혈 확률 10%라 10개면 100%로 상한입니다.
          - id: SecondarySkillMagazine
            priority: optional
            note:
              en: Two Blast Canisters in a row doubles stun uptime for crowd control.
              ko: 캐니스터를 연속 두 번 쏴 기절 유지 시간이 두 배가 되어 무리 제어에 좋습니다.
            stacks:
              target: 3
              min: 2
              max: 3
            stacksReason:
              en: TheGamer recommends 2-3 Backup Magazines for Blast Canister.
              ko: TheGamer는 폭발 캐니스터용 보조 탄창 2~3개를 추천합니다.
        next:
          - sustain
          - procs
      - id: sustain
        phase: mid
        label:
          en: Healing on hit
          ko: 적중 회복
        when:
          en: Leeching Seed if you have little crit. Switch to Harvester's Scythe once you have about 20% crit (two Lens-Maker's Glasses).
          ko: 치명타가 적다면 흡혈 씨앗을, 치명타 약 20%(렌즈 제작자의 안경 2개)부터는 수확꾼의 낫을 챙기세요.
        items:
          - id: Seed
            priority: core
            note:
              en: "Called his best item by community players: every nail heals."
              ko: 커뮤니티에서 MUL-T 최고의 아이템으로 꼽습니다. 못 하나하나가 회복이 됩니다.
            stacks:
              target: 5
              min: 1
            stacksReason:
              en: each Seed heals 0.6 per nail; 5 gives about 3 HP per nail.
              ko: 씨앗 1개당 못 한 발에 0.6 회복이라 5개면 발당 약 3 회복입니다.
          - id: CritGlasses
            priority: optional
            stacks:
              target: 9
              min: 2
              max: 9
            note:
              en: Enables the Scythe switch and adds crit damage.
              ko: 수확꾼의 낫으로 넘어가기 위한 치명타 확률이자 치명 피해 증가입니다.
            stacksReason:
              en: Scythe and Predatory Instincts each add 5% crit, so 9 glasses reach 100%.
              ko: 수확꾼의 낫과 포식 본능이 각각 치명타 5%를 더하니 안경 9개면 100%입니다.
          - id: HealOnCrit
            priority: situational
            note:
              en: Heals more than Leeching Seed once crit chance is high.
              ko: 치명타 확률이 높아지면 흡혈 씨앗보다 회복량이 많습니다.
            stacks:
              target: 3
            stacksReason:
              en: +4 heal per crit per stack; 3 out-heals Seed once crit is high.
              ko: 개당 치명타 회복 +4라 치명타율이 높으면 3개로 씨앗보다 많이 회복합니다.
        next:
          - late
      - id: procs
        phase: mid
        label:
          en: On-hit damage
          ko: 적중 피해
        when:
          en: Take when you already survive fine and want to clear packs and bosses faster.
          ko: 생존이 충분할 때 무리와 보스를 더 빨리 처리하려면 가져가세요.
        items:
          - id: Missile
            priority: core
            note:
              en: About 12 nails per second makes missile procs frequent.
              ko: 초당 약 12발의 못 덕분에 미사일이 자주 발동합니다.
            stacks:
              target: 3
            stacksReason:
              en: nails proc it constantly; 3 copies (+900% per missile) is a strong uncommon count.
              ko: 못이 계속 발동시키니 3개(미사일당 900%)면 충분히 강합니다.
          - id: ChainLightning
            priority: optional
            note:
              en: Chain lightning adds AoE to a single-target weapon.
              ko: 연쇄 번개가 단일 대상 무기에 광역 피해를 더합니다.
            stacks:
              target: 3
            stacksReason:
              en: +2 targets per stack; 3 turns the single-target nails into pack clear.
              ko: 개당 대상 +2라 3개면 단일 대상 못으로도 무리를 정리합니다.
          - id: AttackSpeedOnCrit
            priority: optional
            note:
              en: Nailgun's crit rate stacks the attack speed buff quickly.
              ko: 네일건의 치명타 빈도 덕분에 공격 속도 버프가 빨리 쌓입니다.
            stacks:
              target: 3
            stacksReason:
              en: attack speed cap 36% +24% per stack; 3 gives an 84% cap.
              ko: 공격 속도 상한이 36%에 개당 +24%라 3개면 84%입니다.
        next:
          - late
      - id: late
        phase: late
        label:
          en: Late game
          ko: 후반
        when:
          en: Stage 5 onward, or when a Void chest offers Polylute.
          ko: 5스테이지 이후나 공허 상자에서 폴리류트가 나올 때.
        items:
          - id: Clover
            priority: core
            note:
              en: Nails trigger chance items so often that luck adds a lot.
              ko: 못이 확률형 아이템을 매우 자주 발동시켜 행운의 효과가 큽니다.
            stacks:
              target: 2
            stacksReason:
              en: nails roll chance effects constantly, so a 2nd Clover still pays off for a legendary.
              ko: 못이 확률 효과를 계속 굴리니 전설 아이템이지만 2개째도 값어치가 있습니다.
          - id: ChainLightningVoid
            priority: situational
            note:
              en: Community players report heavy boss damage with many stacks on a nailgun.
              ko: 네일건에 여러 개 쌓으면 보스 피해가 크다는 후기가 있습니다.
            stacks:
              target: 3
            stacksReason:
              en: +3 strikes per stack; 3 Polylutes give 9 strikes per proc on bosses.
              ko: 개당 타격 +3이라 3개면 발동당 9회로 보스를 녹입니다.
          - id: UtilitySkillMagazine
            priority: optional
            note:
              en: Two extra Transport Mode charges and a shorter cooldown fix mobility.
              ko: 차량 모드 충전이 2회 늘고 재사용 대기시간이 줄어 기동력 문제를 해결합니다.
            stacks:
              target: 1
            stacksReason:
              en: one gives 2 extra Transport Mode charges; its cooldown cut does not stack.
              ko: 1개로 운송 모드 충전 2회가 추가되고, 쿨감은 중첩되지 않습니다.
        next:
          - loop
      - id: loop
        phase: loop
        label:
          en: "Loop: nail procs and boss damage"
          ko: "루프: 못 발동과 보스 피해"
        when:
          en: After the first loop, once Clover or several proc items are in place.
          ko: 첫 루프 이후, 57잎 클로버나 발동 아이템을 여럿 갖춘 뒤.
        items:
          - id: Syringe
            priority: core
            stacks:
              target: 10
              min: 4
            note:
              en: Keep stacking; attack speed multiplies every on-hit item.
              ko: 계속 중첩하세요. 공격 속도가 모든 적중 시 아이템을 곱해 줍니다.
            stacksReason:
              en: "3-4 to start, Rogue Ranker: stack aggressively; no cap, so aim for 10."
              ko: TheGamer는 초반 3~4개, Rogue Ranker는 적극적으로 쌓으라고 하며 상한이 없으니 10개를 목표로 하세요.
          - id: BleedOnHit
            priority: core
            stacks:
              target: 10
              min: 3
              max: 10
            note:
              en: A Steam discussion calls stacked bleed on nailgun end-game damage. 10 is the 100% cap.
              ko: 스팀 토론에서는 네일건으로 쌓는 출혈을 엔드게임급 피해라고 합니다. 10개가 100% 상한입니다.
            stacksReason:
              en: 10% bleed chance per stack, so 10 is a 100% chance and the cap.
              ko: 위키 기준 개당 출혈 확률 10%라 10개면 100%로 상한입니다.
          - id: ChainLightningVoid
            priority: situational
            stacks:
              target: 3
              min: 1
            note:
              en: "Wiki: Polylute beats Ukulele when 2 or fewer enemies are near the target, so it is the better final-boss pick. It corrupts all Ukuleles."
              ko: 위키 기준 대상 주변 적이 2마리 이하면 폴리류트가 우쿨렐레보다 강해 최종 보스전에 더 좋습니다. 우쿨렐레를 전부 오염시킵니다.
            stacksReason:
              en: +3 strikes per stack; 3 Polylutes give 9 strikes per proc on bosses.
              ko: 개당 타격 +3이라 3개면 발동당 9회로 보스를 녹입니다.
          - id: AttackSpeedOnCrit
            priority: optional
            stacks:
              target: 3
              min: 1
            note:
              en: "Rogue Ranker: Predatory Instincts compounds with Syringe; the attack speed cap grows +24% per stack."
              ko: Rogue Ranker 기준 포식 본능은 주사기와 겹쳐 강해집니다. 공격 속도 상한이 중첩당 +24%씩 늘어납니다.
            stacksReason:
              en: attack speed cap 36% +24% per stack; 3 gives an 84% cap.
              ko: 공격 속도 상한이 36%에 개당 +24%라 3개면 84%입니다.
          - id: HealOnCrit
            priority: optional
            stacks:
              target: 3
              min: 1
            note:
              en: Replaces Leeching Seed as your sustain once crit is high.
              ko: 치명타가 높아지면 흡혈 씨앗 대신 회복을 맡습니다.
            stacksReason:
              en: +4 heal per crit per stack; 3 out-heals Seed once crit is high.
              ko: 개당 치명타 회복 +4라 치명타율이 높으면 3개로 씨앗보다 많이 회복합니다.
        next: []
    pickOrder:
      common:
        - Syringe
        - Hoof
        - BleedOnHit
        - CritGlasses
        - SecondarySkillMagazine
      uncommon:
        - Seed
        - Missile
        - ChainLightning
        - AttackSpeedOnCrit
        - HealOnCrit
        - Bandolier
    milestones:
      - when:
          en: Once you have 2 Lens-Maker's Glasses (about 20% crit)
          ko: 렌즈 제작자의 안경이 2개(치명타 약 20%)가 되면
        advice:
          en: Take Harvester's Scythe over Leeching Seed for sustain.
          ko: 회복은 흡혈 씨앗보다 수확꾼의 낫을 우선하세요.
        take:
          - HealOnCrit
        stop:
          - Seed
      - when:
          en: Once you have 2-3 Backup Magazines and 2-3 Hoofs
          ko: 보조 탄창과 폴의 염소발이 각각 2~3개가 되면
        advice:
          en: Put further white picks into Syringe and Tri-Tip Dagger.
          ko: 이후 흰색 아이템은 군인의 주사기와 삼각 단검에 쓰세요.
        take:
          - Syringe
          - BleedOnHit
        stop:
          - SecondarySkillMagazine
      - when:
          en: When you have 10 Tri-Tip Daggers or crit reaches 100%
          ko: 삼각 단검이 10개가 되거나 치명타가 100%에 도달하면
        advice:
          en: That chance is capped; stop taking that item.
          ko: 해당 확률이 상한에 닿았으니 그 아이템은 그만 챙기세요.
        take: []
        stop:
          - BleedOnHit
          - CritGlasses
      - when:
          en: Before the final boss, if a Void source offers Polylute
          ko: 최종 보스 전에 공허 보상에서 폴리류트가 나오면
        advice:
          en: Take it if you mostly need single-target damage; keep Ukulele if packs are the problem.
          ko: 단일 대상 피해가 필요하면 고르고, 적 무리가 문제라면 우쿨렐레를 유지하세요.
        take:
          - ChainLightningVoid
        stop: []
      - when:
          en: If Essence of Heresy is offered
          ko: 이단의 정수를 얻을 수 있을 때
        advice:
          en: Skip it; it takes away Power Mode.
          ko: 고르지 마세요. 파워 모드를 잃습니다.
        take: []
        stop:
          - LunarSpecialReplacement
    avoid:
      - id: LunarSpecialReplacement
        reason:
          en: It replaces your special, which takes away Retool or Power Mode and leaves your second primary unusable while it lasts.
          ko: 특수 스킬을 대체해 장비 교체나 파워 모드를 잃고, 그동안 두 번째 주 무기를 쓸 수 없습니다.
    evidence: |-
      Wiki: Auto-Nailgun 0.6 proc coefficient, Power Mode gives 100 armor (nerfed from 200 in PC Patch v1.1.1.2) and -60% move speed. Rogue Ranker: double Nailgun + Power Mode, Syringe priority, Hoof, AtG, Ukulele, Predatory Instincts, Backup Magazine. Steam thread (Nov 2023): Leeching Seed as best item, switch to Harvester's Scythe at about 20% crit, Nailgun Power Mode. Other Steam thread: Polylute stacks. TheGamer (2021): Hoof, 57 Leaf Clover, Hardlight Afterburner. FPS Champion (2022): double Nailgun Power Mode, avoid Essence of Heresy. Strong consensus on Syringe and on-hit. No MUL-T changes found in the SotS or Alloyed Collective patch notes.

      Stack counts and progression: Stack numbers: TheGamer MUL-T guide (Syringe 3-4, Hoof 2-3 early, Backup Magazine 2-3), Steam thread 4029095281635544355 (Leeching Seed best, Scythe at about 20% crit = 2 Lens-Maker's). Caps are math from wiki.gg item data (Tri-Tip 10% linear, Lens-Maker's 10 = 100%, Seed x proc coefficient, Predatory +24% cap per stack). Polylute vs Ukulele: Polylute wiki page and the Steam 'When To Use Void Items' guide (search snippet; page returned 429). Stacked bleed on nailgun: Steam discussion seen in search results. Pick order: Rogue Ranker (Syringe S; AtG, Ukulele, Backup Magazine, Predatory, Bandolier A) and the Steam thread (Seed). No legendary or boss order: sources only name Clover (TheGamer) and Hardlight (build tree), not enough to rank. The wiki MUL-T page itself gives no stack counts for nailgun items.
  - id: toolbot-rebar-burst-retool
    title:
      en: Rebar Burst (Retool)
      ko: 철근 폭딜 (장비 교체)
    difficulty: intermediate
    summary:
      en: Rebar Puncher (1.0 proc coefficient, piercing) with Crowbar one-shots full-health enemies and reliably triggers the bands. Use Retool to keep Auto-Nailgun or Scrap Launcher as your other weapon, and to hold two equipment pieces.
      ko: 철근 펀처(발동 계수 1.0, 관통)와 쇠지렛대로 체력이 가득 찬 적을 한 방에 잡고 반지를 확실히 발동시킵니다. 장비 교체로 자동 네일건이나 고철 발사기를 보조 무기로 두고 장비도 두 개 들 수 있습니다.
    loadout:
      primary: TOOLBOT_PRIMARY_ALT1_NAME
      secondary: TOOLBOT_SECONDARY_NAME
      utility: TOOLBOT_UTILITY_NAME
      special: TOOLBOT_SPECIAL_NAME
    root: core
    nodes:
      - id: core
        phase: early
        label:
          en: Early core
          ko: 초반 핵심
        when:
          en: Stages 1-2.
          ko: 1~2스테이지.
        items:
          - id: Crowbar
            priority: core
            note:
              en: A couple of stacks let Rebar one-shot even Stone Golems for a while.
              ko: 몇 개만 쌓아도 한동안 돌 골렘까지 철근 한 방에 잡을 수 있습니다.
            stacks:
              target: 4
              min: 2
            stacksReason:
              en: guidance is 'a couple' as the minimum; +75% linear with no cap, so 4 (+300%).
              ko: 공략은 최소 '두어 개'이고 개당 +75%로 상한이 없으니 4개(+300%)를 목표로 하세요.
          - id: SecondarySkillMagazine
            priority: core
            note:
              en: More Blast Canisters for groups, since Rebar is single-file.
              ko: 철근은 일직선 공격이라 무리 대응용 캐니스터를 늘려 줍니다.
            stacks:
              target: 3
              min: 2
              max: 3
            stacksReason:
              en: TheGamer recommends 2-3 Backup Magazines; canisters handle groups.
              ko: TheGamer는 보조 탄창 2~3개를 추천하며, 무리는 캐니스터로 처리합니다.
          - id: Hoof
            priority: optional
            note:
              en: Covers MUL-T's slow base speed.
              ko: MUL-T의 느린 기본 속도를 보완합니다.
            stacks:
              target: 2
            stacksReason:
              en: optional here; 2 Hoofs cover MUL-T's slow base speed.
              ko: 선택 아이템이라 2개면 MUL-T의 느린 기본 속도를 보완합니다.
        next:
          - bands
          - scrap
      - id: bands
        phase: mid
        label:
          en: Band procs
          ko: 반지 발동
        when:
          en: Default path for Rebar. Crowbar-boosted Rebar hits guarantee band procs.
          ko: 철근 빌드의 기본 경로입니다. 쇠지렛대로 강해진 철근은 반지를 확실히 발동시킵니다.
        items:
          - id: FireRing
            priority: core
            note:
              en: Each Rebar hit easily clears the 400% threshold.
              ko: 철근 한 발이 400% 조건을 쉽게 넘깁니다.
            stacks:
              target: 3
              min: 1
            stacksReason:
              en: Rebar procs it every recharge; 3 copies make each tornado 900%.
              ko: 철근이 재충전마다 발동시키니 3개면 회오리 피해가 900%입니다.
          - id: IceRing
            priority: core
            note:
              en: Procs alongside Kjaro's Band on the same shots.
              ko: 같은 발에 캬로의 반지와 함께 발동합니다.
            stacks:
