    avoid:
      - id: CritGlassesVoid
        reason:
          en: Corrupts the Lens-Maker's Glasses this build depends on.
          ko: 이 빌드의 핵심인 렌즈 제작자의 안경을 오염시킵니다.
    evidence: |-
      Mixed: from the Steam guide 'OP Mercenary Build' (last updated June 2025, but written assuming Artifact of Command) and the Steam 'Item Builds' guide ('Bleeding Strike': 9 glasses + Predatory + Shatterspleen). The 9-glasses + Predatory tip is also on the wiki's Lens-Maker's page. Harvester's/Predatory also in Rogue Ranker and eXputer. The loadout is not specified by the guide ('any works'), so the tree uses the default Eviscerate, which scales with attack speed. The guide's Gesture of the Drowned + Spinel Tonic lunar combo is equipment and not listed here.

      Stack counts and progression: 9 glasses + 5% items: wiki Lens-Maker's page ('wise to stop stacking at 9'; each of Predatory, Scythe, Shatterspleen gives 5% that does not stack). The build note says Predatory alone covers the last 5%, but by wiki values 9 glasses + one 5% item is 95%, so two are needed. Steam 'Item Builds' guide ('Bleeding Strike': 9 glasses + Predatory + Shatterspleen) and 'OP Mercenary Build' come from the existing build evidence; both returned HTTP 429 on refetch. Attack speed ceiling: Rogue Ranker and wiki Mercenary page. Loop items: Nerd Lodge (Tougher Times, Brainstalks), Rogue Ranker Alien Head page, GameDataCentral looping guide. Sources for this variant's long-run play are thin; no boss order beyond Shatterspleen. Reddit could not be fetched.
