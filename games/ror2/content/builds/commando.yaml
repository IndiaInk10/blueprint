      Stack counts and progression: Thin. Only the wiki supports this variant (Commando page: Frag Grenade is his only AoE and a reliable Band/Singularity Band/Behemoth trigger). Stack facts are wiki item values: Singularity Band +100% damage per stack, 20s recharge, corrupts both Bands; Behemoth radius 4 m +2.5 m; Lysate Cell +1 Special charge and -33% Special cooldown; Alien Head 0.75^n cooldown; Tougher Times hyperbolic table. The loop node is inferred from these values (Frag Grenade is the Special and the Band trigger), not from a guide. No source gives a pick order for this variant (the only same-tier choice, Kjaro's vs Runald's Band, is unranked), so pickOrder is empty.
