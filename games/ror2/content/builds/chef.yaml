    evidence: |-
      Loadout (Dice/Sear/Roll/Glaze) and core Soldier's Syringe + Paul's Goat Hoof + Death Mark come from Deltia's Gaming (Nov 2025, written after the V1.3.8 rework), which also lists Lens-Maker's Glasses and AtG Missile as optional. Rogue Ranker (undated) backs Soldier's Syringe, Bison Steak, Focus Crystal early; Gasoline, Will-o'-the-wisp, Ukulele, Backup Magazine mid; AtG Missile late, and suggests Yes, CHEF! as the special once unlocked. Game Rant (Sep 2024, PRE-rework) supplies Crowbar, Gasoline/Ignition Tank, Death Mark, Focus Crystal, Bandolier, Symbiotic Scorpion, Tri-Tip Dagger, Chronobauble, Hardlight Afterburner, Alien Head, Laser Scope and the Tougher Times/Energy Drink survivability advice. PATCH-SENSITIVE: CHEF was reworked in V1.3.8 (May 2025): Dice now has 3 charges at 200% each, Yes, CHEF! no longer refreshes cooldowns (it now boosts the next skill), Glaze cooldown went 10s->12s. Game Rant's Crowbar 'one-shot with Dice' and Bandolier reasoning predate this. Rogue Ranker says Backup Magazine adds a Glaze charge; Backup Magazine affects the secondary slot, so the note here says Sear. No source lists items to avoid. No source gives a worked Ice Box or Oil Spill build, so none is included. Sources are mostly thin SEO-style guides; no Reddit/Steam consensus thread was found.

