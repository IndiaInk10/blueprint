    evidence: |-
      Wiki: Ion Surge trades damage for mobility and is good for bosses and Mithrix; Energy Drink over Paul's Goat Hoof with Ion Surge; Unstable Tesla Coil against flyers. Steam threads (2021 and later) use Flame Bolt/Nano-Bomb/Ion Surge and say Ion Surge procs bands. Rogue Ranker disagrees and says Ion Surge gives up too much damage in most runs. Smaller tree because fewer sources cover it.

      Stack counts and progression: Ion Surge 8s cooldown and Nano-Bomb 5s: wiki Artificer page. Stack math from wiki.gg item data (Alien Head x0.75 with 0.5s floor, Energy Drink +25% linear, bands fixed 10s). Energy Drink over Hoof and Tesla Coil for flyers: wiki. Backup Magazine 2-3: Steam threads cited in the build. Light Flux: wiki (benefit) vs Steam thread (slower Nano-Bomb charge). Brainstalks as Alien Head alternative: TheGamer (2021), while a Steam discussion says it underperforms on her. Rogue Ranker says Ion Surge gives up too much damage in most runs. Thin sources for this build, so fewer stack entries and no boss order.
