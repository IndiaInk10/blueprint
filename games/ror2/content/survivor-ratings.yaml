      ko: 헌트리스 수준의 물몸, 느린 승천 프로토콜, 루프 후반 광역 공격과 보스에 드론이 전멸할 위험, 골드·드론 등장 운에 좌우됨
    verdict:
      en: Grows into a drone army that deals huge damage mid-run, helped by the November 2025 drone buffs, but fragile health and drone wipes late in a loop make him swingy. Good for players who enjoy economy and pet builds.
      ko: 2025년 11월 드론 상향에 힘입어 중반엔 드론 군단으로 엄청난 딜을 내지만, 물몸인 데다 루프 후반 드론이 전멸하면 급격히 약해져 기복이 큽니다. 운영과 소환수 빌드를 좋아하는 유저에게 맞습니다.
