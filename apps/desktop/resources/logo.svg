  <path d="M14 3H45L61 19V49A12 12 0 0 1 49 61H15A12 12 0 0 1 3 49V15A12 12 0 0 1 15 3Z" fill="url(#paper)" />
  <path d="M45 3V15A4 4 0 0 0 49 19H61Z" fill="#8fc6ff" />

